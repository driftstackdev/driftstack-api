# Cloudflare zone operations, run by hand (workflow_dispatch) with the repo's
# CLOUDFLARE_API_TOKEN — the same secret the Pages deploys use. It exists because
# that token's SCOPE is the open question: the deploys prove Pages Edit; whether
# it can also edit DNS on the driftstack.io zone decides who can do the website
# move (ledger T-3) without a new credential. Prints only booleans, names and
# Cloudflare error codes — never the token, never record contents.
#
name: Cloudflare zone ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: verify (token status, zones, Pages read) or dns-probe (create+delete one TXT record on driftstack.io)
        required: true
        default: verify
        type: choice
        options:
          - verify
          - dns-probe
          - pages-domain-probe
          - attach-io-sites
          - verify-io-domains
          - redirect-dev-to-io

permissions:
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API: https://api.cloudflare.com/client/v4
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Token status
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret unset"; exit 1; }
          r=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$CF_API/user/tokens/verify")
          echo "verify: success=$(jq -r .success <<<"$r") status=$(jq -r '.result.status // "n/a"' <<<"$r") errors=$(jq -c '[.errors[].code]' <<<"$r")"

      - name: Zones visible to the token
        run: |
          set -euo pipefail
          r=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$CF_API/zones?per_page=50")
          echo "zones: success=$(jq -r .success <<<"$r") errors=$(jq -c '[.errors[].code]' <<<"$r")"
          jq -r '.result[]? | "zone: \(.name) status=\(.status)"' <<<"$r"
          if jq -r '.result[]? | .name' <<<"$r" | grep -qx driftstack.io; then echo "driftstack.io: VISIBLE"; else echo "driftstack.io: NOT visible to this token"; fi

      - name: Pages read (custom domains on the marketing project)
        run: |
          set -euo pipefail
          r=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$CF_API/accounts/$CF_ACCOUNT/pages/projects/driftstack-marketing/domains")
          echo "pages domains: success=$(jq -r .success <<<"$r") errors=$(jq -c '[.errors[].code]' <<<"$r")"
          jq -r '.result[]? | "domain: \(.name) status=\(.status)"' <<<"$r"

      - name: Ask Pages to re-verify the pending .io domains (may self-provision DNS)
        if: ${{ inputs.action == 'verify-io-domains' }}
        run: |
          set -euo pipefail
          # The six .io hosts are attached but stuck at status=pending because no
          # CNAME exists and this token cannot see the zone. PATCHing a custom
          # domain asks Pages to re-run verification; for a zone in the SAME
          # account Cloudflare may create the record itself with its own
          # privileges. If it does, the move completes with no new credential. If
          # it does not, the status stays pending and that is the answer.
          check() {
            proj="$1"; host="$2"
            r=$(curl -sS -X PATCH -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT/pages/projects/$proj/domains/$host" --data '{}')
            echo "  $host: patch success=$(jq -r '.success' <<<"$r") status=$(jq -r '.result.status // "n/a"' <<<"$r") errors=$(jq -c '[.errors[]?.code]' <<<"$r")"
          }
          check driftstack-marketing          driftstack.io
          check driftstack-marketing          www.driftstack.io
          check driftstack-customer-dashboard app.driftstack.io
          check driftstack-docs               docs.driftstack.io
          check driftstack-status             status.driftstack.io
          check driftstack-admin-panel        admin.driftstack.io
          echo "--- waiting 45s then re-reading status and DNS ---"
          sleep 45
          for pair in "driftstack-marketing driftstack.io" "driftstack-customer-dashboard app.driftstack.io"; do
            set -- $pair
            st=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$CF_API/accounts/$CF_ACCOUNT/pages/projects/$1/domains" \
              | jq -r --arg h "$2" '.result[]?|select(.name==$h)|.status')
            echo "  $2 status now: ${st:-unknown}"
          done
          echo "--- does it answer over HTTP yet? ---"
          for h in driftstack.io app.driftstack.io; do
            echo "  https://$h/ -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 12 "https://$h/" || true)"
          done

      - name: Attach the driftstack.io hosts to their Pages projects
        if: ${{ inputs.action == 'attach-io-sites' }}
        run: |
          set -euo pipefail
          # Step 1 of the website move (ledger T-3): make .io SERVE before any code
          # points at it. Purely ADDITIVE — every .dev custom domain stays attached
          # and keeps serving, so nothing customer-facing changes here. Idempotent:
          # an already-attached host is reported and left alone.
          fail=0
          attach() {
            proj="$1"; host="$2"
            cur=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
              "$CF_API/accounts/$CF_ACCOUNT/pages/projects/$proj/domains" \
              | jq -r --arg h "$host" '[.result[]?|select(.name==$h)]|length')
            if [ "$cur" != "0" ]; then echo "  $host -> $proj : already attached"; return; fi
            r=$(curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT/pages/projects/$proj/domains" --data "{\"name\":\"$host\"}")
            if [ "$(jq -r .success <<<"$r")" = "true" ]; then
              echo "  $host -> $proj : ATTACHED (status $(jq -r '.result.status // "pending"' <<<"$r"))"
            else
              echo "  $host -> $proj : FAILED $(jq -c '[.errors[]|{code,message}]' <<<"$r")"
              fail=1
            fi
          }
          attach driftstack-marketing          driftstack.io
          attach driftstack-marketing          www.driftstack.io
          attach driftstack-customer-dashboard app.driftstack.io
          attach driftstack-docs               docs.driftstack.io
          attach driftstack-status             status.driftstack.io
          attach driftstack-admin-panel        admin.driftstack.io
          echo "done — every .dev custom domain left attached and serving"
          exit $fail

      - name: 301 the driftstack.dev WEBSITE hosts to driftstack.io (T-3 step 8; probes scope before writing)
        if: ${{ inputs.action == 'redirect-dev-to-io' }}
        run: |
          set -euo pipefail
          # The last step of the website move. Only the six website hosts move; api.,
          # errors., fleet. and staging. are NOT matched and keep serving on .dev. The
          # .dev custom domains stay attached to Pages so the 301 is served on a valid
          # certificate. Path + query are preserved (the desktop auth flow
          # app.driftstack.dev/cli/authorize?… must survive the hop).
          zid=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$CF_API/zones?name=driftstack.dev" | jq -r '.result[0].id // empty')
          test -n "$zid" || { echo "driftstack.dev zone not visible to this token"; exit 1; }
          ep="$CF_API/zones/$zid/rulesets/phases/http_request_dynamic_redirect/entrypoint"
          # Scope probe FIRST: reading the phase entrypoint needs the same Rulesets scope
          # as writing it. An auth error (10000/10001) means the token cannot do this and
          # NOTHING is changed — record the exact code on T-3. A "not found" only means
          # no redirect rules exist yet in this zone, which is the expected starting state.
          probe=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$ep")
          if [ "$(jq -r .success <<<"$probe")" != "true" ]; then
            code=$(jq -r '.errors[0].code // 0' <<<"$probe")
            echo "entrypoint read: success=false code=$code message=$(jq -r '.errors[0].message // ""' <<<"$probe")"
            case "$code" in 10000|10001|10004) echo "→ token lacks Zone → Dynamic Redirect (Rulesets) on driftstack.dev; no change made"; exit 1;; esac
            existing=0; rid=""
          else
            rid=$(jq -r '.result.id // empty' <<<"$probe")
            existing=$(jq -r '[.result.rules[]?]|length' <<<"$probe")
            echo "entrypoint read: ruleset ${rid:-<none>} with $existing existing rule(s)"
            if [ "$(jq -r '[.result.rules[]?|select(.description|startswith("T-3 dev→io"))]|length' <<<"$probe")" != "0" ]; then
              echo "already configured — the T-3 rules are present; nothing to do"; exit 0
            fi
          fi
          rules='[
            {"description":"T-3 dev→io apex","enabled":true,"expression":"(http.host eq \"driftstack.dev\")","action":"redirect",
             "action_parameters":{"from_value":{"status_code":301,"preserve_query_string":true,
               "target_url":{"expression":"concat(\"https://driftstack.io\", http.request.uri.path)"}}}},
            {"description":"T-3 dev→io website subdomains","enabled":true,
             "expression":"(http.host in {\"www.driftstack.dev\" \"app.driftstack.dev\" \"docs.driftstack.dev\" \"status.driftstack.dev\" \"admin.driftstack.dev\"})",
             "action":"redirect","action_parameters":{"from_value":{"status_code":301,"preserve_query_string":true,
               "target_url":{"expression":"wildcard_replace(http.request.full_uri, \"https://*.driftstack.dev/*\", \"https://${1}.driftstack.io/${2}\")"}}}}
          ]'
          if [ "$existing" != "0" ] && [ -n "$rid" ]; then
            # Never PUT over someone else's rules: APPEND to the existing ruleset.
            for i in 0 1; do
              r=$(curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                "$CF_API/zones/$zid/rulesets/$rid/rules" --data "$(jq -c ".[$i]" <<<"$rules")")
              echo "append rule $i: success=$(jq -r .success <<<"$r") $(jq -c '[.errors[]?|{code,message}]' <<<"$r")"
              [ "$(jq -r .success <<<"$r")" = "true" ] || exit 1
            done
          else
            r=$(curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$ep" --data "$(jq -c '{name:"default",description:"T-3 website move: driftstack.dev → driftstack.io",kind:"zone",phase:"http_request_dynamic_redirect",rules:.}' <<<"$rules")")
            echo "create entrypoint: success=$(jq -r .success <<<"$r") rules=$(jq -r '[.result.rules[]?]|length' <<<"$r") $(jq -c '[.errors[]?|{code,message}]' <<<"$r")"
            [ "$(jq -r .success <<<"$r")" = "true" ] || exit 1
          fi
          echo "→ verifying from the runner (propagation is usually seconds):"
          sleep 10
          for u in "https://driftstack.dev/pricing/" "https://www.driftstack.dev/" "https://app.driftstack.dev/cli/authorize?code=probe&state=x" "https://docs.driftstack.dev/api/profiles/"; do
            printf '  %s → ' "$u"; curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 15 "$u"
          done
          for u in "https://api.driftstack.dev/version" "https://errors.driftstack.dev/"; do
            printf '  KEEP %s → ' "$u"; curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 15 "$u"
          done

      - name: Pages custom-domain probe (attach one throwaway .io host to a Pages project, then remove it)
        if: ${{ inputs.action == 'pages-domain-probe' }}
        run: |
          set -euo pipefail
          # The zone-scoped DNS API is closed to this token, but attaching a custom
          # domain to a Pages project is an ACCOUNT-level call, and when the zone
          # lives in the same account Cloudflare provisions the DNS record itself.
          # If that works, the website move needs no new credential at all. The
          # host is a throwaway subdomain and is removed again in the same job.
          # NOT an underscore prefix: Pages rejects that with 8000015 "Domain is
          # invalid", which reads exactly like a permission refusal and is not one.
          # The first run of this probe answered NO for that reason alone.
          HOST=a2probe.driftstack.io
          PROJ=driftstack-marketing
          r=$(curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "$CF_API/accounts/$CF_ACCOUNT/pages/projects/$PROJ/domains" --data "{\"name\":\"$HOST\"}")
          ok=$(jq -r '.success' <<<"$r")
          echo "attach: success=$ok errors=$(jq -c '[.errors[]|{code,message}]' <<<"$r")"
          if [ "$ok" = "true" ]; then
            echo "PAGES DOMAIN ON .IO: YES — this token can attach driftstack.io hosts to Pages projects."
            echo "That is the whole mechanism the website move needs; no zone-scoped token required."
          else
            echo "PAGES DOMAIN ON .IO: NO — the error above says what the token is missing."
          fi
          d=$(curl -sS -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$CF_API/accounts/$CF_ACCOUNT/pages/projects/$PROJ/domains/$HOST" || true)
          echo "cleanup delete: success=$(jq -r '.success // "n/a"' <<<"$d")"

      - name: DNS probe (create + delete one TXT record on driftstack.io)
        if: ${{ inputs.action == 'dns-probe' }}
        run: |
          set -euo pipefail
          # "This token cannot" is an ANSWER, not a failure. Exiting non-zero here
          # painted a red check on main for a probe that had worked perfectly and
          # reported exactly what it was built to report.
          zid=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$CF_API/zones?name=driftstack.io" | jq -r '.result[0].id // empty')
          if [ -z "$zid" ]; then
            echo "DNS EDIT: NO — the driftstack.io zone is not visible to this token, so it cannot provision the T-3 DNS."
            echo "The zone itself exists and is on Cloudflare (same nameservers as driftstack.io); what is missing is zone scope on the token."
            exit 0
          fi
          r=$(curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "$CF_API/zones/$zid/dns_records" \
            --data '{"type":"TXT","name":"_a2-probe.driftstack.io","content":"driftstack-probe","ttl":60}')
          ok=$(jq -r .success <<<"$r")
          echo "dns create: success=$ok errors=$(jq -c '[.errors[].code]' <<<"$r")"
          rid=$(jq -r '.result.id // empty' <<<"$r")
          if [ -n "$rid" ]; then
            d=$(curl -sS -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$CF_API/zones/$zid/dns_records/$rid")
            echo "dns delete: success=$(jq -r .success <<<"$d")"
          fi
          if [ "$ok" = "true" ]; then echo "DNS EDIT: YES — this token can do the T-3 DNS step"; else echo "DNS EDIT: NO — the token is Pages-only"; fi
