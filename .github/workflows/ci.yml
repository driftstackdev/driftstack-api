name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck, lint, unit + integration tests
    runs-on: ubuntu-latest
    # Bound a hung run (e.g. catastrophic regex backtracking) to minutes
    # instead of GitHub's 6h default. Generous vs the ~15-25m normal time.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: driftstack
          POSTGRES_PASSWORD: driftstack
          POSTGRES_DB: driftstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driftstack -d driftstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://driftstack:driftstack@localhost:5432/driftstack
      REDIS_URL: redis://localhost:6379
      DRIVER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # a-deploy-snapshot-that-does-not-judge-the-sha-is-not-a-check derives the
          # "behind" distance from git (HEAD~5); a shallow clone has no such revision.
          fetch-depth: 50

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Setup Python 3.10 (the Python-SDK integration arms run the installed package)
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'packages/sdk-python/pyproject.toml'

      - name: Install the Python SDK into its venv
        # sdk-python-against-the-real-server + webhook-signature-verifies-in-every-sdk
        # assert packages/sdk-python/.venv/bin/python exists and can import driftstack
        # (a silent skip there read as a pass — V-2128). The Python SDK job installs
        # into the runner's interpreter; these arms need the venv path. This job never
        # created one, which is why build-test has been red on every run of record.
        working-directory: packages/sdk-python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      # SDK examples import from `@driftstack/sdk`, which resolves through
      # the workspace symlink to packages/sdk-typescript/dist/. Building the
      # SDK before typecheck ensures dist/ exists when the examples are
      # checked. Same goes for the workspace build of api-types — the SDK
      # depends on its compiled output.
      - name: Build (packages + server + all six Astro apps)
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://api.driftstack.dev' }}
        run: npm run build

      - name: Build SDK (tsup ESM + CJS + .d.ts)
        run: npm run build --workspace packages/sdk-typescript

      # The TS counterpart of the Python wheel smoke test. That one asserted a
      # hand-listed SEVEN accessors while the client exposed nineteen, so a
      # packaging error dropping a resource shipped green; this side had no
      # artifact check at all. Source-level parity IS guarded
      # (cross-sdk-resource-surface-parity), but that reads src/, not dist/ — and
      # a resource can be present in client.ts and absent from the built package
      # if the entry point or exports map stops re-exporting it.
      #
      # Expectation derived from the source, asserted against the BUILT bundle.
      - name: SDK build smoke (every source-declared resource survives the build)
        run: |
          node -e "
          const fs = require('fs');
          const src = fs.readFileSync('packages/sdk-typescript/src/client.ts', 'utf8');
          const expected = [...new Set([...src.matchAll(/readonly (\w+):\s*\w+Resource/g)].map((m) => m[1]))].sort();
          if (expected.length < 15) throw new Error('source scan found only ' + expected.length + ' resources');
          const { Driftstack } = require('./packages/sdk-typescript/dist/index.js');
          const client = new Driftstack({ apiKey: 'ds_test_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' });
          const missing = expected.filter((k) => client[k] === undefined);
          if (missing.length) throw new Error('built client is missing: ' + missing.join(', '));
          console.log('sdk build smoke ok — all ' + expected.length + ' source-declared resources survive the build');
          "

      # Runs HERE because it scans the BUILT html of all six customer-facing
      # apps. It was defined in package.json and invoked by nothing — no job, no
      # hook, no other script — so a guard against shipping "coming soon" copy or
      # an internal `V-123` marker to customers has never actually run.
      - name: Rendered product-status guard (no unshipped-feature copy, no internal markers)
        run: npm run check:rendered-product-status

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Production dependency advisories. Scoped with --omit=dev on purpose:
      # the tree currently carries 12 advisories (5 high) and every one is
      # build or lint tooling — eslint, esbuild, drizzle-kit, autocannon —
      # which never ships to the API. Gating on the whole tree would either
      # block every PR or be permanently muted, and a muted gate catches
      # nothing.
      #
      # Production deps are at ZERO advisories at any severity today, so this
      # starts from a clean baseline rather than grandfathering debt. It is
      # not vacuous: the identical command without --omit=dev exits 1 against
      # this same lockfile, which is what proves the gate can fail.
      #
      # Deploy runs `npm ci --no-audit`, so nothing else checks this.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Migrate database schema
        # Without this the real-PG integration tests (db-*-keyset-drizzle)
        # probe `SELECT 1 FROM profiles`, find no schema, and silently
        # vacuous-pass via their dbReachable guard — they had NEVER
        # actually executed anywhere until 2026-06-12 (found when a local
        # DATABASE_URL run crashed on a raw Date bind the tests carried
        # since birth). Migrating makes them real; their guards now also
        # fail loudly under CI when the DB is unusable.
        run: npm run db:migrate -w apps/server

      - name: Test (unit + integration) with coverage thresholds
        # V-107: vitest.config.ts enforces coverage thresholds (lines,
        # statements, functions, branches). CI fails if coverage drops
        # below the regression gate set in V-107.
        #
        # Run THROUGH verify-suite rather than calling vitest directly. This step
        # used to be `npx vitest run --coverage`, which inherited none of that
        # script's judgement — and the incident it was written for is precisely a
        # vitest run that EXITS 0 while workers die and files silently never
        # execute (`Tests 26677 passed`, nine files missing). Coverage thresholds
        # cannot see that either: a suite that skipped files still reports high
        # coverage over the files it did run.
        #
        # `--all` keeps the scope identical (root config + --coverage) and adds
        # the exit-code, unhandled-error and file-count checks on top.
        run: node scripts/verify-suite.mjs --all

  e2e:
    name: End-to-end (Playwright against real Postgres + Redis)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: driftstack
          POSTGRES_PASSWORD: driftstack
          POSTGRES_DB: driftstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driftstack -d driftstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://driftstack:driftstack@localhost:5432/driftstack
      REDIS_URL: redis://localhost:6379
      DRIVER: mock
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        # Same fail-closed dashboards as build-test: `npm run build` builds all
        # six Astro apps and admin-panel throws without this. Missing here meant
        # e2e would fail at its own build step even once build-test was fixed.
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://api.driftstack.dev' }}
        run: npm run build

      - name: Run e2e suite
        working-directory: apps/server
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/server/playwright-report/
          retention-days: 7

  python-sdk:
    name: Python SDK (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'packages/sdk-python/pyproject.toml'

      - name: Install package + dev deps
        working-directory: packages/sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff check
        working-directory: packages/sdk-python
        run: ruff check .

      - name: Ruff format check
        working-directory: packages/sdk-python
        run: ruff format --check .

      - name: Mypy (strict on hand-written code)
        working-directory: packages/sdk-python
        # `examples` is included deliberately. Those twelve scripts are what a
        # customer copies, and ruff only checks their syntax — a call to an SDK
        # method that has been renamed or removed lints clean and ships broken.
        # The Go SDK already gets this protection for free via
        # `go build ./examples/...`; Python had no equivalent.
        run: mypy src examples

      - name: Pytest
        working-directory: packages/sdk-python
        run: pytest -v

      - name: Build wheel + sdist
        working-directory: packages/sdk-python
        run: |
          pip install build
          python -m build

      - name: Smoke-test wheel install in a fresh venv
        working-directory: packages/sdk-python
        run: |
          python -m venv /tmp/smoke
          # Distribution name in pyproject.toml is `driftstack-sdk`; the
          # built wheel filename is `driftstack_sdk-<version>-*.whl`
          # (PEP 427 normalises distribution-name hyphens to underscores
          # in the wheel filename). The previous glob `driftstack-*.whl`
          # silently stopped matching after the package was renamed away
          # from `driftstack`; pip received the literal pattern and exited 1.
          /tmp/smoke/bin/pip install dist/driftstack_sdk-*.whl
          # The expectation comes from the CHECKED-OUT SOURCE, not a hand-listed
          # subset. This previously asserted seven accessors and printed "all 7
          # resource accessors wired" while the client exposed nineteen — so a
          # packaging error dropping crypto_orders, mfa, team, audit_log or
          # agent_sessions shipped a green wheel. Catching that is what a wheel
          # smoke test is for, and the count in the message made it read complete.
          # ⛔ Path is relative to `working-directory` above, NOT the repo root.
          # It was repo-relative and this step had NEVER run: ci.yml triggers on
          # push/PR to main, and main had not moved in 661 commits.
          EXPECTED=$(python3 -c "import re;print(' '.join(sorted(set(re.findall(r'self[.]([a-z_]+)\\s*=\\s*\\w+Resource[(]', open('src/driftstack/client.py').read())))))")
          echo "source-declared accessors: $EXPECTED"
          /tmp/smoke/bin/python -c "
          import sys
          from driftstack import Driftstack, AsyncDriftstack, verify_webhook_signature
          from driftstack import DriftstackError, RateLimitError, AuthError
          from driftstack._generated.models import Session, ApiKey, WebhookEndpoint
          expected = sys.argv[1].split()
          assert len(expected) >= 15, 'source scan found only %d accessors' % len(expected)
          client = Driftstack(api_key='ds_test_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')
          aclient = AsyncDriftstack(api_key='ds_test_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')
          for accessor in expected:
              assert hasattr(client, accessor), 'sync client is missing %s' % accessor
              assert hasattr(aclient, accessor), 'async client is missing %s' % accessor
          print('wheel smoke ok — all %d source-declared resource accessors wired, sync and async' % len(expected))
          " "$EXPECTED"

  go-sdk:
    name: Go SDK (vet + tests + examples build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false # no go.sum yet — zero non-stdlib runtime deps

      - name: go vet
        working-directory: packages/sdk-go
        run: go vet ./...

      - name: go test
        working-directory: packages/sdk-go
        run: go test -v ./...

      - name: Build examples
        working-directory: packages/sdk-go
        run: go build ./examples/...

  bench-regression:
    # V-165 — perf regression check (advisory mode).
    #
    # `continue-on-error: true` because:
    #   - docs/benchmarks/{auth-path,rate-limit,webhook-signature}.md
    #     note that bench results on shared runners are noisy; a hard
    #     gate would produce false failures.
    #   - First-run bootstrap mode (no baseline) exits 2; advisory
    #     swallows that so the PR doesn't fail the first time around.
    #   - Flipping to a hard gate is a separate founder decision once
    #     the CI baseline accumulates a few runs of stable variance.
    #
    # Threshold: 50% slowdown vs the checked-in CI baseline at
    # docs/benchmarks/baseline.ci.json. Override via the
    # PERF_REGRESSION_THRESHOLD env var.
    name: Perf regression check (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces (bench targets compiled output)
        # 2026-05-20 — PUBLIC_API_BASE_URL must be set for astro
        # admin-panel + customer-dashboard production builds (same
        # gate as task #45's pretest fix). Without this the Perf
        # job's `npm run build` errors before any benchmark runs.
        env:
          PUBLIC_API_BASE_URL: https://api.driftstack.dev
        run: npm run build

      - name: Run benchmarks (JSON output)
        run: npm run bench:json

      - name: Compare against CI baseline
        run: npm run bench:check-regression
