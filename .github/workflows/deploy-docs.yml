# Doc site — deploy pipeline.
#
# Triggered on push to main. Builds the Astro static site at
# `apps/docs/` and deploys the resulting `dist/` to Cloudflare Pages
# via the `wrangler` CLI.
#
# Path-filter triggers are deliberate: the workflow only runs when
# something under `apps/docs/`, this workflow file, or the shared
# root manifests changes — so a backend-only commit doesn't redeploy
# the doc site.
#
# Skipped if `CLOUDFLARE_API_TOKEN` is unset (e.g. fresh repo without
# secrets populated). Build still runs and surfaces any Astro errors
# at PR review time; only the upload step gates on the secret.
#
# Required GitHub secrets (repository-wide; shared with the marketing-
# site deploy):
#   - CLOUDFLARE_API_TOKEN          — token with `Cloudflare Pages
#                                       — Edit` permission.
#   - CLOUDFLARE_ACCOUNT_ID         — Cloudflare account ID.
#
# Required repository variable (DISTINCT from the marketing project):
#   - CLOUDFLARE_DOCS_PROJECT_NAME  — Cloudflare Pages project slug
#                                       for the doc site (e.g.
#                                       `driftstack-docs`). Pre-create
#                                       the project in the CF dashboard
#                                       before the first deploy.
#
# Custom domains + DNS configured in the Cloudflare Pages dashboard:
#   - docs.driftstack.dev → CNAME to the Pages project
# DNS records live in Cloudflare DNS for the driftstack.dev zone.
#
# Founder runbook for first-time setup:
# `docs/founder-actions/v258-cloudflare-pages-docs-setup.md`.

name: Deploy doc site

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: docs-production
      url: https://docs.driftstack.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspace-aware)
        run: npm ci --no-audit

      - name: Build doc site
        run: npm run build --workspace apps/docs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_DOCS_PROJECT_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN unset — skipping Cloudflare Pages upload."
            echo "Build artifact is at apps/docs/dist/ and verified above."
            exit 0
          fi
          if [ -z "${PROJECT_NAME}" ]; then
            echo "CLOUDFLARE_DOCS_PROJECT_NAME variable unset — set as a repo variable in Settings → Variables."
            exit 1
          fi
          npx --no-install wrangler pages deploy apps/docs/dist \
            --project-name="${PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_SHA::8} — $(git log -1 --pretty=%s)"
