# Admin panel — deploy pipeline.
#
# Triggered on push to main. Builds the Astro app at
# `apps/admin-panel/` as static Astro output and deploys the resulting
# `dist/` to Cloudflare Pages via the `wrangler` CLI.
#
# Path-filter triggers are deliberate: only runs when something under
# `apps/admin-panel/`, this workflow file, or shared root manifests
# changes — backend-only commits don't redeploy the admin panel.
#
# Skipped if `CLOUDFLARE_API_TOKEN` is unset (e.g. fresh repo without
# secrets populated). Build still runs and surfaces any Astro errors
# at PR review time; only the upload step gates on the secret.
#
# Required GitHub secrets (repository-wide; shared with marketing /
# docs / dashboard deploys):
#   - CLOUDFLARE_API_TOKEN          — token with `Cloudflare Pages
#                                       — Edit` permission.
#   - CLOUDFLARE_ACCOUNT_ID         — Cloudflare account ID.
#
# Required repository variable (DISTINCT from marketing / docs /
# dashboard variables):
#   - CLOUDFLARE_ADMIN_PANEL_PROJECT_NAME — Cloudflare Pages project
#                                       slug for the admin panel (e.g.
#                                       `driftstack-admin-panel`).
#                                       Pre-create the project in the CF
#                                       dashboard before the first deploy.
#
# Custom domain configured in the Cloudflare Pages dashboard:
#   - admin.driftstack.io → CNAME to the Pages project
# DNS records live in Cloudflare DNS for the driftstack.io zone.
#
# Security posture: admin panel is staff-only. Every dashboard route
# calls /v1/admin/* against api.driftstack.dev which gates on the
# `driftstack_internal_admin` scope (V-134 + V-174). Per the
# DRIFTSTACK_STAFF_EMAILS allowlist on the api server, only enrolled
# staff get that scope appended to their web-session synthetic key.
# The DNS-subdomain + scope gate together form the security boundary.

name: Deploy admin panel

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin-panel/**'
      - '.github/workflows/deploy-admin-panel.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: deploy-admin-panel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: admin-panel-production
      url: https://admin.driftstack.io
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspace-aware)
        run: npm ci --no-audit

      - name: Build api-types (admin-panel depends on @driftstack/api-types)
        run: npm run build --workspace @driftstack/api-types

      - name: Build admin panel
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://api.driftstack.dev' }}
          PUBLIC_SENTRY_DSN_DASHBOARD: ${{ secrets.PUBLIC_SENTRY_DSN_DASHBOARD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_RELEASE: ${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
        run: npm run build --workspace apps/admin-panel

      - name: Refuse to publish content that links to a domain with no DNS
        run: |
          set -euo pipefail
          # 2026-09-04 incident. The .io Pages custom domains were attached but the
          # zone had no CNAMEs, so driftstack.io did not resolve. The site content
          # had already been migrated to link at .io, the deploy went out, and every
          # navigation link on the live .dev sites failed at the DNS layer for ~20
          # minutes. Nothing in the pipeline objected: the build was valid, the
          # deploy succeeded, and the pages were "correct" — they just pointed at a
          # host that did not exist. Publishing is the step that can tell.
          if grep -rqE "https://[a-z.]*driftstack\.io" "apps/admin-panel/dist" 2>/dev/null; then
            # ⛔ The first version of this check used `getent || nslookup` and PASSED
            # on a host that serves nothing: nslookup exits 0 when the ZONE exists
            # with NS records but has no address, which is exactly the broken state
            # it was written to catch. An exit code is not the property. Ask for the
            # thing that actually has to work — an HTTP response.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://driftstack.io/ || echo 000)
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              echo "REFUSING TO DEPLOY: this build links to driftstack.io, which answered $code."
              echo "Create the Pages CNAMEs for the .io hosts before publishing."
              exit 1
            fi
            echo "build links to driftstack.io and it answered $code — safe to publish"
          else
            echo "build does not link to driftstack.io — nothing to check"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_ADMIN_PANEL_PROJECT_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN unset — skipping Cloudflare Pages upload."
            echo "Build artifact is at apps/admin-panel/dist/ and verified above."
            exit 0
          fi
          if [ -z "${PROJECT_NAME}" ]; then
            echo "::error::CLOUDFLARE_ADMIN_PANEL_PROJECT_NAME variable unset — set as a repo variable in Settings → Variables."
            exit 1
          fi
          npx --no-install wrangler pages deploy apps/admin-panel/dist \
            --project-name="${PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_SHA::8} — $(git log -1 --pretty=%s)"
