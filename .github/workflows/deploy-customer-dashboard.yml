# Customer dashboard — deploy pipeline.
#
# Triggered on push to main. Builds the Astro app at
# `apps/customer-dashboard/` as static Astro output and deploys the
# resulting `dist/` to Cloudflare Pages via the `wrangler` CLI.
#
# Path-filter triggers are deliberate: only runs when something under
# `apps/customer-dashboard/`, this workflow file, or shared root
# manifests changes — backend-only commits don't redeploy the dashboard.
#
# Skipped if `CLOUDFLARE_API_TOKEN` is unset (e.g. fresh repo without
# secrets populated). Build still runs and surfaces any Astro errors
# at PR review time; only the upload step gates on the secret.
#
# Required GitHub secrets (repository-wide; shared with marketing
# + docs deploys):
#   - CLOUDFLARE_API_TOKEN          — token with `Cloudflare Pages
#                                       — Edit` permission.
#   - CLOUDFLARE_ACCOUNT_ID         — Cloudflare account ID.
#
# Required repository variable (DISTINCT from the marketing + docs
# variables):
#   - CLOUDFLARE_DASHBOARD_PROJECT_NAME — Cloudflare Pages project
#                                       slug for the dashboard (e.g.
#                                       `driftstack-customer-dashboard`).
#                                       Pre-create the project in the CF
#                                       dashboard before the first deploy.
#
# Custom domain configured in the Cloudflare Pages dashboard:
#   - app.driftstack.io → CNAME to the Pages project
# DNS records live in Cloudflare DNS for the driftstack.io zone.
#
# Founder runbook: section C of
# `docs/founder-actions/v259-cloudflare-pages-all-projects-setup.md`.

name: Deploy customer dashboard

on:
  push:
    branches: [main]
    paths:
      - 'apps/customer-dashboard/**'
      - '.github/workflows/deploy-customer-dashboard.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: deploy-customer-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: customer-dashboard-production
      url: https://app.driftstack.io
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspace-aware)
        run: npm ci --no-audit

      - name: Build api-types (customer-dashboard depends on @driftstack/api-types)
        run: npm run build --workspace @driftstack/api-types

      - name: Build customer dashboard
        env:
          # V-278.B/F follow-up — bake the live API origin into the
          # client bundle so the dashboard talks to api.driftstack.dev,
          # not localhost:3000.
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://api.driftstack.dev' }}
          # V-469 — per-service Sentry. DSN is build-time-baked into
          # client bundle; integration skips entirely when DSN unset.
          # SENTRY_AUTH_TOKEN governs source-map upload (no-op when
          # unset, runtime unaffected). All four are reused-or-shared
          # with the marketing deploy.
          PUBLIC_SENTRY_DSN_DASHBOARD: ${{ secrets.PUBLIC_SENTRY_DSN_DASHBOARD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_RELEASE: ${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
        run: npm run build --workspace apps/customer-dashboard

      - name: Refuse to publish content that links to a domain with no DNS
        run: |
          set -euo pipefail
          # 2026-09-04 incident. The .io Pages custom domains were attached but the
          # zone had no CNAMEs, so driftstack.io did not resolve. The site content
          # had already been migrated to link at .io, the deploy went out, and every
          # navigation link on the live .dev sites failed at the DNS layer for ~20
          # minutes. Nothing in the pipeline objected: the build was valid, the
          # deploy succeeded, and the pages were "correct" — they just pointed at a
          # host that did not exist. Publishing is the step that can tell.
          if grep -rqE "https://[a-z.]*driftstack\.io" "apps/customer-dashboard/dist" 2>/dev/null; then
            if ! getent hosts driftstack.io >/dev/null 2>&1 && ! nslookup driftstack.io >/dev/null 2>&1; then
              echo "REFUSING TO DEPLOY: this build links to driftstack.io, which does not resolve."
              echo "Create the Pages CNAMEs for the .io hosts before publishing."
              exit 1
            fi
            echo "build links to driftstack.io and it resolves — safe to publish"
          else
            echo "build does not link to driftstack.io — nothing to check"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_DASHBOARD_PROJECT_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN unset — skipping Cloudflare Pages upload."
            echo "Build artifact is at apps/customer-dashboard/dist/ and verified above."
            exit 0
          fi
          if [ -z "${PROJECT_NAME}" ]; then
            echo "CLOUDFLARE_DASHBOARD_PROJECT_NAME variable unset — set as a repo variable in Settings → Variables."
            exit 1
          fi
          npx --no-install wrangler pages deploy apps/customer-dashboard/dist \
            --project-name="${PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_SHA::8} — $(git log -1 --pretty=%s)"
