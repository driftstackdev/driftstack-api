# Driftstack API — deploy pipeline (Option B verdict 2026-05-17:
# drop Docker, match prod systemd+node reality).
#
# Triggered when CI completes on main (below). The previous docker-compose approach
# (image build → ghcr.io push → docker compose pull) did not match
# what prod actually runs — production is bare-systemd + Node 22 at
# /opt/driftstack/api (per the internal 2026-05-15 deploy-pipeline
# mismatch notes). Operators have been deploying via
# scripts/deploy-bridge.sh manually since 2026-05-15 (10+ successful
# prod deploys).
#
# Option B keeps deploy-bridge.sh as the SOURCE OF TRUTH and has the
# GH Actions runner call it. Single execution path for both manual
# and CI-triggered deploys; no Docker drift between dev and CI.
#
# Two-environment flow (gated on CI since 2026-09-24, security sweep E-9):
#   - Runs when the CI workflow COMPLETES on a push to main
#     (workflow_run) and deploys exactly the commit that CI run tested.
#     A red or cancelled CI run deploys nothing and raises the deploy-failure
#     issue.
#     CI never cancels a run on main (ci.yml, 2026-09-25), so every commit
#     of a burst of pushes gets its own CI result. Each green one deploys
#     when its run finishes, in whatever order the runs finish; one that
#     finishes after a newer commit went live is skipped (below), so each
#     environment ends on the newest green commit.
#   - Staging deploys first. Production follows only after staging
#     deployed the same commit in the same run. No approval gate.
#   - Neither environment is ever moved to a commit older than the one
#     it is running (scripts/deploy-is-forward.mjs).
#
# Per Workstream A spec (V-051 — REVISED 2026-05-17):
#   - Hetzner Cloud VMs (CCX13 default — 4 vCPU, 16GB RAM, €25/mo).
#   - systemd at /opt/driftstack/api on the host.
#   - npm ci on the runner; atomic-swap dist + node_modules into
#     /opt/driftstack/api via SSH.
#   - DB migrations applied BEFORE restart (deploy-bridge.sh runs
#     node dist/db/migrate.js after the swap).
#   - Smoke test against /health post-restart; auto-revert via
#     scripts/revert-bridge.sh on post-deploy-verify failure.
#
# Required GitHub secrets (per environment):
#   - HETZNER_DEPLOY_SSH_KEY — private key with deploy-scoped access
#                              to root@<prod|staging>. Pubkey listed
#                              in docs/founder-actions/v278-hetzner-
#                              deploy-keys.md.
#
# Required repository-wide secrets:
#   - SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT (source-map upload
#                              — Sentry runtime works without these;
#                              stack traces will be minified).
#
# What was removed:
#   - Docker buildx / build-push-action / ghcr.io push (no longer used
#     by prod).
#   - docker-compose pull / up -d (no docker-compose on the host).
#   - DEPLOY_DOTENV_BASE64 secret (env is on the host at
#     /opt/driftstack/api/.env; rotation is SSH-write, not GH Action
#     payload — narrower secret-leak surface).

name: Deploy

on:
  # Security sweep E-9 (2026-09-24). This ran on every push to main, and a push
  # says nothing about its tests: main is not branch-protected, the production
  # job needed only the source-map and staging jobs, and a commit whose CI was
  # red (or still running) reached production minutes after the push. It now
  # runs when CI COMPLETES on main; the ci-gate job below lets a run through only
  # if it succeeded on a push to main in this repository, and every job deploys
  # that run's head_sha, never the branch tip.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A manual re-run from main. The gate asks GitHub for a successful CI run on a
  # push to main for the exact commit, exactly as for the automatic path.
  workflow_dispatch:

concurrency:
  # One deploy at a time, in arrival order, never cancelled mid-rollout.
  #
  # Only a run that can deploy joins `deploy-api`: a successful CI run on a push
  # to main in this repository (the ci-gate's own test, plus success), or a
  # dispatch. Every other CI completion (red, cancelled, a pull request, a fork
  # whose branch is called main) gets a group of its own, so it can neither
  # wait behind a deploy nor take a pending deploy's place. A red or cancelled
  # run still runs its ci-gate, which fails and raises the deploy-failure issue.
  #
  # `queue: max` keeps every pending deploy instead of GitHub's default of one:
  # by default a newly queued run CANCELS the pending one, so a re-run of an old
  # CI run arriving behind a newer commit's pending deploy replaced it, then
  # skipped as older, and the newer commit waited for the next green push with no
  # alert. Queued in order, the older run is a no-op (deploy-is-forward exit 3).
  # A fixed name rather than the ref: every workflow_run event carries the
  # default branch as its ref whatever commit it is about.
  # (Every line of the expression below is indented alike so YAML folds it into
  # one line; a deeper-indented line would keep its newline.)
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    (github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.head_branch == 'main' &&
    github.event.workflow_run.head_repository.full_name == github.repository &&
    github.event.workflow_run.conclusion == 'success'))
    && 'deploy-api' || format('deploy-nothing-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  # Proves CI passed on the commit about to be deployed, and names that commit
  # for every later job. A pull request's CI run also completes, and a fork's
  # branch can be called main, so the event, the branch AND the repository are
  # all checked: only a push to main in this repository is deployable.
  ci-gate:
    name: CI passed on this commit, and it is on main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      deploy: ${{ steps.pick.outputs.deploy }}
    steps:
      - name: Pick the commit and prove CI passed on it
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$RUN_SHA"
            case "$RUN_CONCLUSION" in
              success) ;;
              cancelled)
                # CI's own concurrency never cancels a run on main (ci.yml gives
                # each run there a group of its own), so this run was stopped some
                # other way: by hand, or a job cut off at its timeout-minutes. Its
                # commit never deploys, and when it was the last push production
                # stays behind until the next green run. That is a stall, and a
                # stall nobody hears about is what notify-on-failure is for, so
                # the gate FAILS rather than passing quietly.
                echo "::error::CI on ${SHA} was cancelled, so this commit does not deploy; production stays on the commit it runs until CI passes on a newer one. Re-run CI on this commit to deploy it."
                exit 1
                ;;
              skipped)
                # No CI job ran, so there is no result to deploy on.
                echo "::notice::CI on ${SHA} was skipped; nothing to deploy."
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                # Red CI on main FAILS this job, so notify-on-failure raises the
                # deploy-failure issue: production is not advancing, and saying so
                # is the point (see the note above notify-on-failure).
                echo "::error::CI concluded '${RUN_CONCLUSION}' on ${SHA}. Production does not advance until CI passes on main."
                exit 1
                ;;
            esac
          else
            if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
              echo "::error::a manual deploy runs from main only (dispatched from ${DISPATCH_REF})."
              exit 1
            fi
            SHA="$DISPATCH_SHA"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a commit id: ${SHA}"
            exit 1
          fi
          # Asked of GitHub, not taken from the event alone: a successful CI run
          # on a push to main for exactly this commit. For a dispatch it is the
          # only evidence there is.
          passed=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$SHA" -f event=push -f branch=main -f status=success \
            --jq '.total_count')
          # A non-number (an API error body, "null") must refuse, not fall through:
          # `[ x -lt 1 ]` on a non-integer is an error, which `if` reads as false.
          if ! [[ "$passed" =~ ^[0-9]+$ ]] || [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run on a push to main for ${SHA}; refusing to deploy it."
            exit 1
          fi
          # And the commit is on main: main is ahead of it, or it is main's tip.
          relation=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...main" --jq '.status')
          case "$relation" in
            ahead|identical) ;;
            *)
              echo "::error::${SHA} is not on main (compare: ${relation}); refusing to deploy it."
              exit 1
              ;;
          esac
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  source-map-upload:
    name: Build + upload source maps to Sentry
    needs: ci-gate
    if: needs.ci-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The commit CI passed. Under workflow_run the default checkout is the
          # branch tip, which can be a newer commit CI has not finished with.
          ref: ${{ needs.ci-gate.outputs.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build server (for source-map upload only — prod build
          runs again on the Hetzner host via deploy-bridge.sh)
        run: |
          npm ci --no-audit --include=dev
          # apps/server imports from @driftstack/api-types AND
          # @driftstack/webhook-delivery. Both are composite TS projects;
          # both need dist/ before apps/server tsc --build runs. Use
          # build:packages (root script) so any future workspace-package
          # added under packages/* gets compiled automatically (no need
          # to remember to add an explicit step).
          npm run build:packages
          npm run build --workspace=@driftstack/server

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ needs.ci-gate.outputs.sha }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "SENTRY_AUTH_TOKEN unset — skipping source-map upload."
            echo "Runtime still works; stack traces will be minified until the secret is populated."
            exit 0
          fi
          npx --yes @sentry/cli@^2 releases new "${SENTRY_RELEASE}"
          npx --yes @sentry/cli@^2 sourcemaps upload \
            --release="${SENTRY_RELEASE}" \
            --url-prefix="app:///apps/server/dist" \
            apps/server/dist
          npx --yes @sentry/cli@^2 releases finalize "${SENTRY_RELEASE}"
          npx --yes @sentry/cli@^2 releases set-commits "${SENTRY_RELEASE}" --auto || true

  deploy-staging:
    name: Deploy to staging (via deploy-bridge.sh)
    needs: [ci-gate, source-map-upload]
    if: needs.ci-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      # Production runs only when this is true: staging took THIS commit.
      deployed: ${{ steps.forward.outputs.proceed }}
    environment:
      name: staging
      url: https://staging.driftstack.dev
    steps:
      - name: Check Hetzner deploy SSH key is set
        id: gate
        env:
          HETZNER_DEPLOY_SSH_KEY: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
        run: |
          # 2026-05-20 — gate FAILS loudly on missing secret so this
          # workflow can't exit success-trivially. Prior behavior
          # (ready=false → exit 0) let main go ~10h without an actual
          # deploy while every workflow run reported success; nothing
          # in the operator surface signalled the silent skip. See
          # docs/founder-actions/v278-hetzner-deploy-keys.md to
          # populate the secret. If the founder INTENTIONALLY wants
          # to ship without an SSH key (post-launch when GH Actions
          # path is removed entirely), delete this job — don't make
          # the gate silent again.
          if [ -z "$HETZNER_DEPLOY_SSH_KEY" ]; then
            echo "::error::HETZNER_DEPLOY_SSH_KEY repo secret is unset; deploy cannot proceed."
            echo "See docs/founder-actions/v278-hetzner-deploy-keys.md to populate the secret."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (deploy-bridge.sh + post-deploy-verify.mjs live here)
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          # The commit the ci-gate proved; see the source-map job.
          ref: ${{ needs.ci-gate.outputs.sha }}
          # ⛔ FULL history. deploy-bridge.sh's DEPLOY_VIA_BUNDLE path runs
          # `git bundle create` from THIS checkout, and a bundle built from a
          # shallow clone cannot be cloned on the far side: the remote fails
          # "Failed to traverse parents" / "remote did not send all necessary
          # objects". actions/checkout defaults to fetch-depth 1, so the
          # script's own comment claiming the bundle "carries full origin/main
          # history" was false the moment it ran in CI.
          fetch-depth: 0

      - name: Set up Node 22 (post-deploy-verify.mjs is a node script)
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure SSH for Hetzner staging host
        if: steps.gate.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Prime known_hosts so the deploy-bridge ssh calls don't fail on the
          # StrictHostKeyChecking prompt. TOFU (not a pinned fingerprint) is
          # intentional — the box can be reprovisioned; we just need its CURRENT
          # key reliably. ssh-keyscan can transiently return nothing (runner->
          # Hetzner network blip / momentarily slow sshd); a bare `|| true` would
          # swallow that, leave known_hosts empty, and the later deploy-bridge
          # ssh would fail with the cryptic "Host key verification failed"
          # (exit 255). Retry a few times and fail CLEAR if the key never lands.
          # ⛔ BOTH hosts, not just staging. deploy-bridge.sh's staging DB-isolation
          # pre-flight SSHes to PROD to read its DATABASE_URL host and compare. With
          # only the staging key primed that call died on "Host key verification
          # failed", the guard's `2>/dev/null || echo ""` swallowed it, the prod host
          # read as EMPTY, and the guard refused the deploy.
          #
          # That is not hypothetical: the guard was tightened on 2026-07-12 (after a
          # staging migration reached prod) and this priming was never widened to
          # match, so EVERY deploy failed from that day. Last green run 2026-07-12;
          # 18 consecutive failures; production went 72 commits stale and the AI
          # chat 400'd in front of customers for weeks. The pipeline was refusing
          # correctly and saying so only in a swallowed stderr.
          for host in 116.203.22.197 128.140.37.74; do
            for attempt in 1 2 3 4 5; do
              ssh-keyscan -t ed25519 "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
              if grep -qF "$host" ~/.ssh/known_hosts; then break; fi
              echo "ssh-keyscan attempt $attempt for $host returned no key; retrying in 3s..."
              sleep 3
            done
            if ! grep -qF "$host" ~/.ssh/known_hosts; then
              echo "::error::could not obtain SSH host key for $host after 5 attempts (sshd unreachable?)"
              exit 1
            fi
          done

      # Never backwards (E-9): a re-run of an old CI run completes long after a
      # newer commit went live. Exit 0 deploys; 3 means staging already runs a
      # newer commit, which skips this run (production too) without failing it;
      # anything else — not on main, diverged, or a live commit that cannot be
      # read while this is not main's tip — fails the job and raises the
      # deploy-failure issue. (With /version down, main's tip still deploys:
      # nothing on main is newer, and it is how a fix-forward reaches a broken
      # environment.)
      - name: Refuse to move staging to an older commit
        id: forward
        if: steps.gate.outputs.ready == 'true'
        env:
          SHA: ${{ needs.ci-gate.outputs.sha }}
        run: |
          set +e
          node scripts/deploy-is-forward.mjs --base-url https://staging.driftstack.dev --sha "$SHA"
          rc=$?
          set -e
          case "$rc" in
            0) echo "proceed=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "::notice::staging already runs a newer commit than ${SHA}; not deploying it."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$rc" ;;
          esac

      - name: Run scripts/deploy-bridge.sh staging
        if: steps.forward.outputs.proceed == 'true'
        # 2026-05-20 — pass the sha explicitly. Without it, the
        # bridge defaults SHA to "main" and clones the current tip,
        # which may have moved past the workflow-triggering commit if
        # another push landed during the workflow run. The bridge
        # then ships THAT newer commit but post-deploy-verify is
        # told to expect the original (triggering) SHA, causing a
        # false-negative auto-revert. Since 2026-09-24 the sha is the
        # one the ci-gate proved CI passed on (under workflow_run,
        # github.sha is the branch tip, not the tested commit).
        # ⛔ DEPLOY_VIA_BUNDLE=1 — do NOT let the host clone from GitHub.
        # deploy-bridge.sh:186 defaults to an ANONYMOUS clone, which works only
        # while this repo is public. Every operator runbook already prescribes the
        # bundle path (:154); the workflow was the one caller that did not set it,
        # so a repo-visibility flip would silently break prod deploys with CI
        # still green. Shipping the scp'd bundle is also one fewer credential on
        # the host.
        env:
          DEPLOY_VIA_BUNDLE: '1'
          SHA: ${{ needs.ci-gate.outputs.sha }}
        run: bash scripts/deploy-bridge.sh staging "$SHA"

  deploy-production:
    name: Deploy to production (CONTINUOUS — no approval gate; via deploy-bridge.sh)
    needs: [ci-gate, source-map-upload, deploy-staging]
    # Staging first: production runs only when staging deployed this same commit
    # in this run.
    if: needs.deploy-staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    # ⛔ CORRECTED 2026-09-06. This previously asserted that the "production"
    # environment was configured in repo settings to demand founder sign-off before
    # this job ran. IT WAS NOT, and was not when that sentence was written.
    # (The original wording is deliberately NOT reproduced here: a guard asserts
    # that claim is absent from this file, and quoting it verbatim would either
    # trip the guard or — worse — pass only because a line wrap split the string.)
    #
    # Measured, not read: `gh api repos/:owner/:repo/environments` returns
    # `protection_rules: []` for EVERY environment, production included, and
    # `gh api .../branches/main/protection` answers "Branch not protected". The
    # five most recent runs each completed staging→production in 267-294 s with no
    # approval pause.
    #
    # So every push to `main` ships to production unreviewed. That is the owner's
    # deliberate choice — they confirmed they want continuous auto-deploy — and the
    # wording is corrected rather than the behaviour, because a claimed control
    # nobody configured is worse than an acknowledged absence: an auditor reads the
    # sentence and stops looking.
    #
    # ✅ GATED ON CI since 2026-09-24 (security sweep E-9; ledger row
    # N-DEPLOY-GATE). This used to say the opposite: `needs:` listed only
    # source-map-upload and deploy-staging, so a red test suite did not block a
    # production deploy. The workflow now runs only when CI completes on main,
    # the ci-gate job proves CI succeeded on exactly the commit deployed, and
    # this job runs only after staging took that same commit. Still continuous —
    # a green CI deploys with nobody approving — and still no approval gate.
    environment:
      name: production
      url: https://api.driftstack.dev
    steps:
      - name: Check Hetzner deploy SSH key is set
        id: gate
        env:
          HETZNER_DEPLOY_SSH_KEY: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
        run: |
          # 2026-05-20 — gate FAILS loudly on missing secret so this
          # workflow can't exit success-trivially. Same fix as the
          # staging gate above. See docs/founder-actions/v278-hetzner-
          # deploy-keys.md to populate the secret.
          if [ -z "$HETZNER_DEPLOY_SSH_KEY" ]; then
            echo "::error::HETZNER_DEPLOY_SSH_KEY repo secret is unset; deploy cannot proceed."
            echo "See docs/founder-actions/v278-hetzner-deploy-keys.md to populate the secret."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          # The commit the ci-gate proved; see the source-map job.
          ref: ${{ needs.ci-gate.outputs.sha }}
          # ⛔ FULL history. deploy-bridge.sh's DEPLOY_VIA_BUNDLE path runs
          # `git bundle create` from THIS checkout, and a bundle built from a
          # shallow clone cannot be cloned on the far side: the remote fails
          # "Failed to traverse parents" / "remote did not send all necessary
          # objects". actions/checkout defaults to fetch-depth 1, so the
          # script's own comment claiming the bundle "carries full origin/main
          # history" was false the moment it ran in CI.
          fetch-depth: 0

      - name: Set up Node 22
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure SSH for Hetzner prod host
        if: steps.gate.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Robust TOFU keyscan with retry + fail-clear (same rationale as the
          # staging step — a swallowed transient keyscan miss → empty known_hosts
          # → cryptic "Host key verification failed" mid-deploy).
          host=128.140.37.74
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -t ed25519 "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -qF "$host" ~/.ssh/known_hosts; then break; fi
            echo "ssh-keyscan attempt $attempt for $host returned no key; retrying in 3s..."
            sleep 3
          done
          if ! grep -qF "$host" ~/.ssh/known_hosts; then
            echo "::error::could not obtain SSH host key for $host after 5 attempts (prod sshd unreachable?)"
            exit 1
          fi

      # Never backwards, against production's own live commit (same exit codes
      # as the staging step).
      - name: Refuse to move production to an older commit
        id: forward
        if: steps.gate.outputs.ready == 'true'
        env:
          SHA: ${{ needs.ci-gate.outputs.sha }}
        run: |
          set +e
          node scripts/deploy-is-forward.mjs --base-url https://api.driftstack.dev --sha "$SHA"
          rc=$?
          set -e
          case "$rc" in
            0) echo "proceed=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "::notice::production already runs a newer commit than ${SHA}; not deploying it."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$rc" ;;
          esac

      - name: Run scripts/deploy-bridge.sh prod
        if: steps.forward.outputs.proceed == 'true'
        # 2026-05-20 — pass the sha explicitly (same race-fix as
        # staging deploy step above; the ci-gate's sha since 2026-09-24).
        # ⛔ DEPLOY_VIA_BUNDLE=1 — do NOT let the host clone from GitHub.
        # deploy-bridge.sh:186 defaults to an ANONYMOUS clone, which works only
        # while this repo is public. Every operator runbook already prescribes the
        # bundle path (:154); the workflow was the one caller that did not set it,
        # so a repo-visibility flip would silently break prod deploys with CI
        # still green. Shipping the scp'd bundle is also one fewer credential on
        # the host.
        env:
          DEPLOY_VIA_BUNDLE: '1'
          SHA: ${{ needs.ci-gate.outputs.sha }}
        run: bash scripts/deploy-bridge.sh prod "$SHA"

  # ⛔ THE PIPELINE'S REAL FAILURE MODE WAS SILENCE, NOT BREAKAGE.
  #
  # deploy.yml last went green on 2026-07-12 and then failed 18 consecutive
  # times — 4 on 2026-08-23, 14 on 2026-08-31 — while production sat 72 commits
  # stale and the AI chat returned 400 to customers because the deployed server
  # predated the model enum the GUI sends. Every one of those runs was correctly
  # red and correctly reported, in a list nobody opens. Repairing the pipeline
  # without this job just resets the seven-week clock.
  #
  # A GitHub issue rather than a chat ping: it needs no credential this repo does
  # not already have, it persists until someone closes it, and it is the only
  # channel here that survives nobody looking on the day it fires.
  #
  # ⚠️ DEDUPED ON PURPOSE. 18 failures must produce ONE issue with 18 comments,
  # not 18 issues — an alert that floods is unread for the same reason a silent
  # one is.
  #
  # Since 2026-09-24 a red CI run on main fails the ci-gate job and lands here
  # too: production no longer advances past a red main, and a stall nobody hears
  # about is the failure this job exists for. Since 2026-09-25 so does a
  # cancelled one.
  notify-on-failure:
    name: Open or update the deploy-failure issue
    needs: [ci-gate, source-map-upload, deploy-staging, deploy-production]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or comment the tracking issue
        uses: actions/github-script@v8
        env:
          # The commit this run was about. Under workflow_run, context.sha is the
          # default branch tip, not the commit CI tested.
          DEPLOY_SHA: ${{ needs.ci-gate.outputs.sha || github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const MARKER = '<!-- deploy-failure-tracker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              MARKER,
              `**Deploy failed** on \`${(process.env.DEPLOY_SHA ?? context.sha).slice(0, 9)}\`.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Production does not advance while this is failing. Check how far behind it is:',
              '`curl -s https://api.driftstack.dev/version` and compare `git_sha` against `main`.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
              per_page: 20,
            });
            const existing = open.data.find((i) => (i.body ?? '').includes(MARKER));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Commented on existing deploy-failure issue #${existing.number}`);
              return;
            }
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Deploy pipeline is failing — production is not advancing',
              labels: ['deploy-failure'],
              body,
            });
            core.notice(`Opened deploy-failure issue #${created.data.number}`);
