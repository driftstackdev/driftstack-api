# Status site — deploy pipeline.
#
# Triggered on push to main. Builds the Astro static site at
# `apps/status-site/` and deploys the resulting `dist/` to Cloudflare
# Pages via the `wrangler` CLI. Mirrors deploy-docs.yml.
#
# Path-filtered: only runs when something under `apps/status-site/`,
# this workflow file, or the shared root manifests changes.
#
# Skipped (build-only, exit 0) if `CLOUDFLARE_API_TOKEN` is unset.
#
# Required GitHub secrets (repository-wide; shared with the other site
# deploys):
#   - CLOUDFLARE_API_TOKEN   — token with `Cloudflare Pages — Edit`.
#   - CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID.
#
# Required repository variable:
#   - CLOUDFLARE_STATUS_SITE_PROJECT_NAME — Pages project slug
#                                            (`driftstack-status`).
#
# Custom domain + DNS (status.driftstack.io → the Pages project) are
# configured in the Cloudflare dashboard / DNS for the driftstack.io
# zone. Setup runbook: docs/founder-actions/v660-status-site-cloudflare-setup.md.

name: Deploy status site

on:
  push:
    branches: [main]
    paths:
      - 'apps/status-site/**'
      - '.github/workflows/deploy-status-site.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: deploy-status-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: status-site-production
      url: https://status.driftstack.io
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (workspace-aware)
        run: npm ci --no-audit

      - name: Build status site
        run: npm run build --workspace apps/status-site

      - name: Refuse to publish content that links to a domain with no DNS
        run: |
          set -euo pipefail
          # 2026-09-04 incident. The .io Pages custom domains were attached but the
          # zone had no CNAMEs, so driftstack.io did not resolve. The site content
          # had already been migrated to link at .io, the deploy went out, and every
          # navigation link on the live .dev sites failed at the DNS layer for ~20
          # minutes. Nothing in the pipeline objected: the build was valid, the
          # deploy succeeded, and the pages were "correct" — they just pointed at a
          # host that did not exist. Publishing is the step that can tell.
          if grep -rqE "https://[a-z.]*driftstack\.io" "apps/status-site/dist" 2>/dev/null; then
            # Two earlier versions of this check passed on a host serving nothing.
            # (1) `getent || nslookup` — nslookup exits 0 when the ZONE exists with
            # NS records but has no address, which IS the broken state. (2) curl
            # with `|| echo 000` — curl already prints 000 on a connection failure,
            # so the fallback concatenated to "000000", which matched neither the
            # equality test nor the >=500 test and sailed through. A fallback that
            # invents a value is how a guard reports health it never measured.
            #
            # So: ALLOW-LIST. Only an explicit 2xx/3xx publishes; everything else,
            # including an empty string, blocks. Verified against the real hosts
            # before landing: driftstack.io -> '000' refuse, driftstack.dev -> '200'
            # pass, api.driftstack.dev/health -> '200' pass.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://driftstack.io/ 2>/dev/null || true)
            case "$code" in
              2??|3??)
                echo "build links to driftstack.io and it answered $code — safe to publish"
                ;;
              *)
                echo "REFUSING TO DEPLOY: this build links to driftstack.io, which answered '${code:-no response}'."
                echo "Create the Pages CNAMEs for the .io hosts before publishing."
                exit 1
                ;;
            esac
          else
            echo "build does not link to driftstack.io — nothing to check"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_STATUS_SITE_PROJECT_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN unset — skipping Cloudflare Pages upload."
            echo "Build artifact is at apps/status-site/dist/ and verified above."
            exit 0
          fi
          if [ -z "${PROJECT_NAME}" ]; then
            echo "CLOUDFLARE_STATUS_SITE_PROJECT_NAME variable unset — set as a repo variable in Settings → Variables."
            exit 1
          fi
          npx --no-install wrangler pages deploy apps/status-site/dist \
            --project-name="${PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_SHA::8} — $(git log -1 --pretty=%s)"
