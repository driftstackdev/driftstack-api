# V-243 / D-2026-05-06-03 — GUI client cross-platform release workflow.
#
# Triggered on tags matching `gui-v*` (e.g. `gui-v0.1.0`). Builds three
# platform binaries in parallel, signs each with the Tauri Updater
# private key, uploads to a GitHub Release, and writes the
# `latest.json` manifest the in-app updater consumes.
#
# Required GitHub repository secrets:
#   * TAURI_UPDATER_PUBKEY — public key embedded in tauri.conf.json
#     replacement step. Generate via `npx tauri signer generate`
#     (founder action; see docs/founder-actions/v243-tauri-updater-keys.md).
#   * TAURI_UPDATER_PRIVKEY — private key for signing update bundles.
#   * TAURI_UPDATER_PRIVKEY_PASSWORD — password protecting the private
#     key (set during `signer generate`).
#
# Required GitHub repository variables:
#   * (none yet — VITE_SENTRY_DSN can be added when the Sentry project
#     is created; absence cleanly disables telemetry per V-242 gate.)
#
# Pre-launch posture: NO OS-level binary signing. Customers see
# "unknown publisher" / Gatekeeper warnings on first install (normal
# for indie apps). Subsequent updates are signed via the Tauri Updater
# public-key. Per-platform code signing certs are deferred (see
# D-2026-05-06-03 follow-up D-* entries when reached).

name: GUI Release

on:
  push:
    tags:
      - 'gui-v*'

jobs:
  build:
    # tauri-action creates + publishes the GitHub Release (releaseName /
    # releaseDraft:false below) using GITHUB_TOKEN — which needs
    # contents:write. The repo default is read-only, so scope it here
    # (least-privilege: only this job, only on gui-v* tags).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Rust (with rust-toolchain.toml pin per V-240)
        uses: dtolnay/rust-toolchain@stable

      # The `targets:` input above used to carry the two Apple targets and it
      # silently did nothing useful: dtolnay/rust-toolchain adds targets to the
      # toolchain IT installs (stable), while src-tauri/rust-toolchain.toml pins
      # 1.95.0 and overrides every cargo invocation under that directory. So the
      # targets landed on stable, the build ran on 1.95.0, and the first release
      # ever cut died with:
      #
      #   failed to build x86_64-apple-darwin binary: Target x86_64-apple-darwin
      #   is not installed (installed targets: aarch64-apple-darwin)
      #
      # Add them to the PINNED toolchain instead, from inside the directory the
      # pin governs so rustup resolves the same toolchain cargo will. Kept out of
      # rust-toolchain.toml deliberately: putting Apple targets there would make
      # the Windows and Linux legs download macOS std libs they never link.
      - name: Add universal macOS targets to the pinned toolchain
        if: matrix.platform == 'macos-latest'
        working-directory: apps/gui-client/src-tauri
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/gui-client/src-tauri -> target'

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm deps
        run: npm ci

      - name: Build all workspace packages (transitive deps)
        # Same workspace-build-order fix as deploy.yml + gui-build-check.yml
        # (2026-05-19). packages/sdk-typescript imports from
        # @driftstack/api-types; the api-types composite project must be
        # built before sdk-typescript tsup runs dts emit.
        run: npm run build:packages

      - name: Build SDK (transitive dep of gui-client)
        run: npm run build --workspace packages/sdk-typescript

      # A tag that disagrees with the app version ships a DEAD updater: the
      # assets are named for the app version, latest.json advertises the app
      # version, and every install already running that version is told it is
      # current. gui-v0.1.0 was cut against version 0.0.1 and did exactly that.
      # Fail the release instead of publishing something that can never update.
      - name: Tag must match the app version
        shell: bash
        run: |
          app_version=$(node -p "require('./apps/gui-client/src-tauri/tauri.conf.json').version")
          expected="gui-v${app_version}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the app version (${app_version}). Expected ${expected}. Bump apps/gui-client/{package.json,src-tauri/tauri.conf.json,src-tauri/Cargo.toml} or retag."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches app version ${app_version}"

      - name: Replace TAURI_UPDATER_PUBKEY placeholder
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_UPDATER_PUBKEY }}" ]; then
            echo "::error::TAURI_UPDATER_PUBKEY secret missing — see docs/founder-actions/v243-tauri-updater-keys.md"
            exit 1
          fi
          # Replace the literal placeholder in tauri.conf.json with the secret.
          # (Tauri 2.x reads $VAR-style env in tauri.conf.json but the updater
          # `pubkey` field requires the actual key at build; we substitute.)
          node -e "
            const fs = require('fs');
            const path = 'apps/gui-client/src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            cfg.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBKEY;
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
          "
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}

      - name: Build + sign Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action reads GITHUB_TOKEN from env to create the
          # release; Actions does not auto-export secrets.GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVKEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVKEY_PASSWORD }}
          # V-242 — Sentry DSN. Empty when unset; gate in telemetry.ts
          # short-circuits cleanly so no event leaves the customer.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        with:
          projectPath: apps/gui-client
          tagName: ${{ github.ref_name }}
          releaseName: 'Driftstack GUI ${{ github.ref_name }}'
          releaseBody: |
            Cross-platform Driftstack GUI client release.

            **Install**
            - macOS: download the `.dmg`. First-launch may prompt about an unidentified developer; right-click → Open to override.
            - Windows: download the `.exe` installer. Windows SmartScreen may flag the unsigned binary; click "More info" → "Run anyway".
            - Linux: download the `.AppImage` (portable) or `.deb` (Debian/Ubuntu).

            **Auto-update**
            Subsequent versions auto-update via the Tauri Updater (public-key signed). The manifest at `latest.json` is consumed by every running install.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
