[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "driftstack-sdk"
version = "0.1.5"
description = "Driftstack Python SDK — stealth iPhone Safari automation. Import as `driftstack`."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Driftstack" }
]
keywords = ["driftstack", "browser-automation", "ios", "safari", "stealth"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic[email]>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  # PINNED, not a floor. ruff is a FORMATTER as well as a linter, and
  # `ruff format --check` is a CI gate — so an unpinned range means a ruff
  # release can reformat files and turn CI red with no commit having touched
  # any Python. That is exactly what happened on 2026-08-23: CI reported "1 file
  # would be reformatted" while the pinned-here version reports all 73 clean.
  # Bump this deliberately, running `ruff format` in the same commit.
  "ruff==0.15.13",
  "mypy>=1.10",
  "datamodel-code-generator[http]>=0.25",
]

[project.urls]
Homepage = "https://driftstack.io"
Repository = "https://github.com/driftstackdev/driftstack-api"
Issues = "https://github.com/driftstackdev/driftstack-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/driftstack"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/driftstack",
  "/README.md",
  "/pyproject.toml",
]

# ──────────────────────────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  # Pydantic emits deprecation warnings for some patterns we generate
  # via datamodel-code-generator; tolerate them so tests don't fail on
  # codegen output we don't fully control.
  "default::DeprecationWarning:pydantic",
  "default::DeprecationWarning:driftstack._generated",
]

# ──────────────────────────────────────────────────────────────────
# ruff
# ──────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/driftstack/_generated"]

[tool.ruff.lint]
# Conservative starter set; tighten in follow-up commits.
select = ["E", "F", "I", "B", "UP", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "PT011"]

# ──────────────────────────────────────────────────────────────────
# mypy — strict on hand-written code; permissive on _generated
# ──────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = "langchain_core.*"
# Optional third-party integration used by examples/langchain_tool.py only.
# The example imports it inside a try/except and raises an actionable message
# when it is absent, so it must NOT be a hard dependency of this SDK — but
# without this override mypy cannot type-check the examples directory at all,
# and an example calling a renamed SDK method would ship broken to customers.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "driftstack._generated.*"
# Codegen output isn't always strict-clean — `conint(...)` /
# `constr(...)` factory calls aren't valid type annotations to mypy
# even though Pydantic v2 accepts them at runtime. Skip type-checking
# for the codegen module entirely; the wrapper layer that customers
# actually touch stays strict, and the generated models are runtime-
# tested via tests/test_generated_models.py.
ignore_errors = true

[[tool.mypy.overrides]]
module = "driftstack.resources.*"
# Resource files call `self._http.request(...)` which returns `Any`
# (JSON deserialization can yield dict / list / scalar / None per
# endpoint). Each resource method declares a precise return type
# (`dict[str, Any]` / `LiveKitInfo` / etc.) and forwards the
# untyped JSON to the caller. Mypy's `no_any_return` rule flags
# every return — 136+ sites — because Any → typed is a narrowing.
#
# Two valid mitigations: cast at every call site (mechanical noise,
# ~136 lines), or scope the rule to allow Any-return in resources.
# The latter wins on readability + maintenance: cast() spam adds
# zero precision because the underlying value IS unverified runtime
# JSON; mypy was already trusting that on the call site. Scoped
# override keeps strict checking everywhere else (http.py, client.py,
# retry.py, errors.py, webhook_signature.py).
#
# Tracked in docs/internal/2026-05-19-audit-log-coverage-audit.md
# (audit-log gap context) + the FULL AUTOPILOT directive's
# "Python SDK mypy 132 errors" backlog slice.
warn_return_any = false
