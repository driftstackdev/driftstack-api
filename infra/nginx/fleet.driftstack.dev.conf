# fleet.driftstack.dev — DIRECT (grey-cloud, NOT Cloudflare-proxied) origin for the
# fleet-node control-plane WebSocket. api.driftstack.dev is CF-proxied + CF mangles
# the long-lived control WS (Code=57 + -1011 flap, 2026-06-24, bus W2863); the Mac
# workers connect HERE so the WS goes straight to the node app, no CF in the path.
#
# Deploy (prereqs on a fresh box, in order):
#   1. DNS: fleet.driftstack.dev A → origin IP, DNS-only / grey-cloud (NOT orange).
#   2. Cert: certbot certonly --dns-cloudflare \
#        --dns-cloudflare-credentials /etc/letsencrypt/cf-dns-creds.ini -d fleet.driftstack.dev
#   3. Map: install infra/nginx/ws_upgrade_map.conf → /etc/nginx/conf.d/ (provides $connection_upgrade).
#   4. This vhost: → /etc/nginx/sites-available/ + symlink into sites-enabled/ ; nginx -t ; reload.
#   5. Daemon: DRIFTSTACK_CONTROL_ENDPOINT=wss://fleet.driftstack.dev/v1/fleet/events (configure.sh default).
server {
  listen 80;
  listen [::]:80;
  server_name fleet.driftstack.dev;
  location = /nginx-health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name fleet.driftstack.dev;

  ssl_certificate     /etc/letsencrypt/live/fleet.driftstack.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fleet.driftstack.dev/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  client_max_body_size 4m;
  send_timeout 30s;
  gzip off;

  access_log /var/log/nginx/fleet.driftstack.dev.access.log;
  error_log /var/log/nginx/fleet.driftstack.dev.error.log warn;

  location = /nginx-health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  # The fleet-node control-plane WebSocket (the reason this vhost exists). Forwards
  # the WS Upgrade to the node app; long timeouts for the long-lived heartbeat link.
  location = /v1/fleet/events {
    # The fleet-node auth JWT rides in ?ds_token= (URLSessionWebSocketTask strips the
    # Authorization header on WS upgrades), and the default 'combined' log_format logs the
    # full request line incl. the query → the bearer token would be written to the access
    # log in cleartext. Disable access logging for this path (connects are still observable
    # via the Node app's structured, token-redacted logs). The token is also short-lived
    # (≤300s) + single-use, but don't persist bearer material to disk regardless.
    access_log off;
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
  location / {
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }
}
