# WebSocket upgrade map — $connection_upgrade is "upgrade" when the client sent
# an Upgrade header, else "close" (preserves normal keep-alive). Used by the
# fleet.driftstack.dev /v1/fleet/events location so nginx forwards the WS upgrade
# to the node app.
#
# Deploy: install to /etc/nginx/conf.d/ws_upgrade_map.conf (http-context, loaded
# before the server blocks that reference $connection_upgrade).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
