# Security fix (2026-07-01, closes the 2026-06-13 CF-Connecting-IP origin-spoof
# gap — docs/internal/2026-06-13-cf-connecting-ip-spoof-origin-exposure.md,
# founder decision-queue item #1, Option B "recommended, low-risk").
#
# BEFORE: api.driftstack.dev.conf / staging.driftstack.dev.conf each had
# `set_real_ip_from 0.0.0.0/0;` — nginx trusted the CF-Connecting-IP header
# from ANY connecting peer, not just Cloudflare. Since the origin's ufw allows
# 443/tcp from Anywhere (no Cloudflare-only firewall / no Authenticated Origin
# Pulls), an attacker could connect directly to the origin IP and forge
# `CF-Connecting-IP: <anything>`, which nginx would trust as $remote_addr and
# forward via X-Forwarded-For — Fastify's trustProxy resolves req.ip to that
# forged value, defeating EVERY IP-keyed rate limit (login, signup, MFA
# challenge/step-up, password-reset, magic-link, OAuth token/introspect,
# the global pre-auth flood gate) and poisoning issuedFromIp/audit-log fields.
#
# AFTER: CF-Connecting-IP is honored ONLY when the direct TCP peer is actually
# a Cloudflare edge node (one of the ranges below). A forged header from any
# other peer leaves $remote_addr as the attacker's real (still-rotatable, but
# no longer a free/instant/untraceable) socket IP, so rate limits key on a
# real network address again — restoring the actual control instead of a
# header any client can set to an arbitrary string.
#
# Deploy: installed to /etc/nginx/conf.d/cloudflare-real-ip.conf by
# infra/bootstrap/deploy-api.sh (loaded once at http-context via nginx's
# `include /etc/nginx/conf.d/*.conf;`, inherited by every server block —
# mirrors the existing ws_upgrade_map.conf snippet's install pattern). The
# per-vhost `set_real_ip_from 0.0.0.0/0;` lines are REMOVED (set_real_ip_from
# is cumulative across multiple directives, not last-wins — leaving 0.0.0.0/0
# in place anywhere would silently re-widen trust back to "everyone").
#
# Source: https://www.cloudflare.com/ips-v4 + https://www.cloudflare.com/ips-v6
# (fetched 2026-07-01). Cloudflare's ranges change rarely but do change —
# re-fetch + redeploy this file periodically (a systemd-timer auto-refresh is
# flagged as a follow-up hardening item, not required for this fix to be
# correct today).

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
