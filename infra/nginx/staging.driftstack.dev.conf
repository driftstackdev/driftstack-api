# V-278.F / V-278.M — staging nginx vhost with origin TLS.
# See api.driftstack.dev.conf for design notes; same shape, staging
# host. Cert covers staging.driftstack.dev + api.staging.driftstack.dev
# (single LE cert with 2 SAN entries).

server {
  listen 80;
  listen [::]:80;
  server_name staging.driftstack.dev api.staging.driftstack.dev;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name staging.driftstack.dev api.staging.driftstack.dev;

  ssl_certificate     /etc/letsencrypt/live/staging.driftstack.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.driftstack.dev/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  set_real_ip_from 0.0.0.0/0;
  real_ip_header CF-Connecting-IP;

  client_max_body_size 4m;

  access_log /var/log/nginx/staging.driftstack.dev.access.log;
  error_log /var/log/nginx/staging.driftstack.dev.error.log warn;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Fleet-node control-plane WebSocket — forwards the WS Upgrade so the node
  # app's @fastify/websocket route can complete the 101 handshake (see the
  # api.driftstack.dev vhost for the full rationale / the 2026-06-18 fix).
  location = /v1/fleet/events {
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }
}
