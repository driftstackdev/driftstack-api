# V-278.F — staging nginx vhost.
#
# Identical shape to api.driftstack.dev.conf but on the staging host;
# names api.staging.driftstack.dev for the API + staging.driftstack.dev
# for the dashboard mirror. Adjust as deployment lands.

server {
  listen 80;
  listen [::]:80;
  server_name staging.driftstack.dev api.staging.driftstack.dev;

  set_real_ip_from 0.0.0.0/0;
  real_ip_header CF-Connecting-IP;

  client_max_body_size 4m;

  access_log /var/log/nginx/staging.driftstack.dev.access.log;
  error_log /var/log/nginx/staging.driftstack.dev.error.log warn;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }
}
