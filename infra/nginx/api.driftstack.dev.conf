# V-278.B / V-278.M — nginx vhost for api.driftstack.dev with origin TLS.
#
# After V-278.M, Cloudflare's SSL/TLS mode is set to "Full (strict)":
# the customer-edge leg is HTTPS via Cloudflare's Universal SSL (auto-
# issued, auto-renewed); the Cloudflare-to-origin leg is HTTPS via the
# Let's Encrypt cert below (issued via DNS-01 with the deploy automation's
# Cloudflare API token + auto-renewed by certbot's systemd timer).
#
# Plaintext port 80 is kept as an HTTP→HTTPS redirect so direct
# probes against the origin IP still terminate cleanly. Real customer
# traffic always goes through Cloudflare which terminates HTTPS at the
# edge, then re-establishes HTTPS on this vhost.

# HTTP→HTTPS redirect on port 80.
server {
  listen 80;
  listen [::]:80;
  server_name api.driftstack.dev;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Production HTTPS vhost.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.driftstack.dev;

  ssl_certificate     /etc/letsencrypt/live/api.driftstack.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.driftstack.dev/privkey.pem;

  # TLS 1.2 + 1.3 only; modern ciphers from Mozilla's intermediate set.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  # Real client IP — Cloudflare passes it via CF-Connecting-IP. Trust for
  # this header is now scoped to Cloudflare's actual edge IP ranges via
  # /etc/nginx/conf.d/cloudflare-real-ip.conf (http-context, loaded before
  # this server block — see infra/nginx/cloudflare-real-ip.conf for the
  # full rationale). Security fix 2026-07-01: this vhost previously had its
  # own `set_real_ip_from 0.0.0.0/0;` here, trusting the header from ANY
  # peer (a direct-origin connection could forge it, defeating every IP
  # rate limit) — removed, not just superseded, because set_real_ip_from
  # is cumulative across directives, not last-wins.

  # 100m (was 4m) for the session file-upload route (POST /v1/agent-sessions/:id/files):
  # a 64 MiB file → ~85 MiB base64 JSON body; the route's own bodyLimit (96 MiB) is the
  # real cap, other routes are bounded by Fastify per-route limits, and the surface is
  # bounded by Cloudflare (≤100 MB) + the API rate-limit. (Founder "control files".)
  client_max_body_size 100m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;

  gzip off;

  access_log /var/log/nginx/api.driftstack.dev.access.log;
  error_log /var/log/nginx/api.driftstack.dev.error.log warn;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Fleet-node control-plane WebSocket (mac workers). Unlike location / below
  # (which sets Connection "" for HTTP keep-alive), this forwards the WS Upgrade
  # so the node app's @fastify/websocket route can complete the 101 handshake.
  # Without it, nginx downgrades the upgrade to a plain GET → the node 404s a
  # valid token / 401s a bad one (the 2026-06-18 connect blocker). Long timeouts
  # because the heartbeat connection is long-lived.
  location = /v1/fleet/events {
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  # SSE/EventSource routes — the browser EventSource API can't set an
  # Authorization header, so both carry the bearer web-session token via
  # `?ds_token=` instead (see apps/server/src/middleware/auth.ts::
  # requireAuthEventSource + lib/redact-url.ts). That lib already scrubs the
  # token from the app's own request logger + Sentry, but the default
  # 'combined' log_format on location / below logs the full request line
  # incl. query string BEFORE the request ever reaches the Node app — same
  # class of leak as /v1/fleet/events on the fleet vhost (which already
  # disables access logging for the same reason). Disable it here too.
  location = /v1/account/me/notifications {
    access_log off;
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location ~ ^/v1/agent-sessions/[^/]+/transcript$ {
    access_log off;
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  # Routes whose handler BLOCKS on a fleet-node round-trip that can legitimately
  # outlast the 60s catch-all below.
  #
  #   POST /v1/account/me/proxies/:id/test   — a VPN row's probe is allowed 80s
  #     (the node's published 70s bring-up budget + 10s slack). WireGuard alone
  #     spends up to 12s on the utun device and up to 15s on the handshake poll
  #     before it can even report failure, then the QUIC leg's 20s ceiling, a
  #     teardown and two post-tunnel exit fetches.
  #   POST /v1/profiles/:id/trim             — relays a trimProfile and awaits
  #     trimResult, budgeted at 60s, which TIED with the catch-all: nginx starts
  #     its clock first (auth, ownership lookup and the relay reservation all
  #     precede the handler's own timer), so the tie was a race the handler
  #     always lost.
  #
  # Both routes build a DISCRIMINATED 200 body for every outcome, timeout
  # included. At 60s nginx answered first with its own 504 HTML and that work was
  # thrown away — a tunnel that was merely slow looked like a server fault, which
  # is the exact symptom the desktop's 30s -> 90s deadline fix was made to kill,
  # relocated one layer inward. The ordering handler < nginx < desktop <
  # Cloudflare(100s) is now pinned by
  # apps/server/tests/unit/edge-timeout-vs-handler-budget-cross-source-invariant.test.ts,
  # which parses THIS FILE the way nginx resolves a location. Change a budget on
  # either side and that test says so.
  location ~ ^/v1/(account/me/proxies/[^/]+/test|profiles/[^/]+/trim)$ {
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }
}
