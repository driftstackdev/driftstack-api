# V-278.B — nginx vhost for api.driftstack.dev.
#
# Cloudflare proxied + Universal SSL terminates TLS at the edge; this
# vhost serves plaintext HTTP on port 80 (Cloudflare → origin is also
# encrypted via Cloudflare's "Full" SSL/TLS mode if configured at the
# zone level — set that in V-278.H DNS step).
#
# The Fastify API listens on 127.0.0.1:7780; nginx reverse-proxies
# everything to it. Cloudflare's bot-fight-mode + WAF run upstream of
# this vhost.

server {
  listen 80;
  listen [::]:80;
  server_name api.driftstack.dev;

  # Real client IP — Cloudflare passes it via CF-Connecting-IP. The
  # Fastify trustProxy config reads X-Forwarded-For; we set both so
  # the audit log + rate-limit buckets see the actual customer IP.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header CF-Connecting-IP;

  # Body limit slightly above the 3.5 MiB avatar upload route limit.
  client_max_body_size 4m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;

  # Disable nginx's gzip — Cloudflare handles compression at the edge.
  gzip off;

  access_log /var/log/nginx/api.driftstack.dev.access.log;
  error_log /var/log/nginx/api.driftstack.dev.error.log warn;

  # Liveness probe served directly by nginx (cheap, no app round-trip).
  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Don't buffer streamed responses (status SSE, etc.).
    proxy_buffering off;
  }
}
