# V-278.B / V-278.M — nginx vhost for api.driftstack.dev with origin TLS.
#
# After V-278.M, Cloudflare's SSL/TLS mode is set to "Full (strict)":
# the customer-edge leg is HTTPS via Cloudflare's Universal SSL (auto-
# issued, auto-renewed); the Cloudflare-to-origin leg is HTTPS via the
# Let's Encrypt cert below (issued via DNS-01 with the agent's
# Cloudflare API token + auto-renewed by certbot's systemd timer).
#
# Plaintext port 80 is kept as an HTTP→HTTPS redirect so direct
# probes against the origin IP still terminate cleanly. Real customer
# traffic always goes through Cloudflare which terminates HTTPS at the
# edge, then re-establishes HTTPS on this vhost.

# HTTP→HTTPS redirect on port 80.
server {
  listen 80;
  listen [::]:80;
  server_name api.driftstack.dev;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Production HTTPS vhost.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.driftstack.dev;

  ssl_certificate     /etc/letsencrypt/live/api.driftstack.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.driftstack.dev/privkey.pem;

  # TLS 1.2 + 1.3 only; modern ciphers from Mozilla's intermediate set.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  # Real client IP — Cloudflare passes it via CF-Connecting-IP. The
  # Fastify trustProxy config reads X-Forwarded-For; we set both so
  # the audit log + rate-limit buckets see the actual customer IP.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header CF-Connecting-IP;

  client_max_body_size 4m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;

  gzip off;

  access_log /var/log/nginx/api.driftstack.dev.access.log;
  error_log /var/log/nginx/api.driftstack.dev.error.log warn;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    proxy_pass http://127.0.0.1:7780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }
}
