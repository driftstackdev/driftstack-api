# Arc 4 Wave 2.B sub-slice 8.21 (v2-#8) — Prometheus alert rules.
#
# Consumed by Prometheus / VictoriaMetrics via the configured
# alertmanager. The rule file is mounted at the scrape target on
# deploy (deploy bridge: scripts/deploy-bridge.sh follows up with the
# alertmanager wire as a separate slice when the first production
# alertmanager lands).
#
# Format: standard Prometheus alerting rules
# (https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/).
#
# Severity convention:
#   - critical: customer-impacting failure or imminent breakage; pages
#               oncall immediately (PagerDuty / Opsgenie routing).
#   - warning:  customer-visible degradation or signal worth a Slack
#               nudge; not a page.
#   - info:     trend signals routed to the team channel only.
#
# Drift guard: ops/alerts/__tests__/alert-rules.test.ts pins these
# rule names + metric references against the MetricsRegistry catalog
# (METRIC_NAMES) so renaming a counter breaks CI before the alert
# silently stops firing in prod.

groups:
  - name: driftstack-pair-mode
    rules:
      - alert: PairModeHighTakeoverFailureRate
        # When >25% of pair-mode takeover requests in the last 10
        # minutes are failing into invalid-transition territory, the
        # state machine is misaligned with the dashboard's
        # expectations. Page on this.
        expr: |
          (
            sum(rate(driftstack_pair_mode_transition_total{to=~"takeover-queued"}[10m]))
            /
            sum(rate(driftstack_pair_mode_transition_total{to=~"takeover-pending|takeover-queued"}[10m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'Pair-mode takeover queue depth exceeds 25%'
          description: |
            More than 25% of takeover requests in the last 10 minutes
            are being queued (decompose in-flight). Sustained high
            queue depth suggests AgentRuntime decompose latency is
            hurting interactive takeover responsiveness.

      - alert: ScheduledJobChainDead
        # Every recurring sweep survives by enqueueing its own successor, so
        # one pending row is the steady state. Zero means the chain stopped
        # and will not resume without a process restart — the failure each
        # register* helper warns about in its own comments. The retention
        # sweeps that keep three privacy-policy §9 commitments are among the
        # chains that can die this way, so page on it.
        #
        # The gauge reports 0 rather than dropping the series precisely so
        # this can alert on a VALUE. Alerting on an absent series would fire
        # identically when the scrape target itself is down.
        expr: |
          driftstack_scheduled_job_chain_pending == 0
        for: 15m
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'Background job chain {{ $labels.job_type }} has stopped'
          description: |
            No pending row exists for {{ $labels.job_type }}. Recurring jobs
            re-arm themselves, so this means the chain is broken and the work
            is not happening — it will not recover on its own. Restart the
            API process to re-seed the chain, then find out why the tick
            stopped re-arming.

      - alert: RetentionPurgeArmNotRunning
        # An arm of the account-deletion sweep reported `skipped`, which
        # means it was never wired — not that it had nothing to purge.
        # Three privacy-policy.md §9 erasure commitments ride on this
        # sweep, and this is exactly how they stop silently: the sweeper
        # was once gated on an unrelated feature flag, so an unset
        # MFA_ENCRYPTION_KEY switched all three off while every tick
        # still reported success. A skipped arm is a live compliance
        # gap, so page on any of it.
        expr: |
          sum(increase(driftstack_retention_purge_total{outcome="skipped"}[24h])) by (arm) > 0
        for: 1h
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'Retention purge arm {{ $labels.arm }} is not wired'
          description: |
            The account-deletion retention sweep reported `skipped` for
            the {{ $labels.arm }} arm. That arm is not wired, so the
            erasure it performs is not happening and the 30-day
            privacy-policy §9 commitment it covers is not being kept.
            Check the sweeper's dependency wiring in bootstrap.

      - alert: RetentionPurgeFailing
        # Distinct from the above on purpose: `failed` means the arm IS
        # wired and is throwing every tick. Same end state — data that
        # should be erased is not — but a different fix, so it gets its
        # own rule rather than being folded into one "purge unhealthy".
        expr: |
          sum(increase(driftstack_retention_purge_total{outcome="failed"}[6h])) by (arm) > 0
        for: 30m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'Retention purge arm {{ $labels.arm }} is failing'
          description: |
            The {{ $labels.arm }} arm of the account-deletion retention
            sweep is erroring. It retries next tick and the candidate
            rows stay selected, so this is recoverable — but sustained
            failure means the 30-day erasure window is being missed.

      - alert: PairModeHeartbeatTimeoutSpike
        # Auto-handback events should be rare. A spike means clients
        # are dropping mid-pair-mode — network issue or dashboard bug.
        expr: |
          sum(rate(driftstack_pair_mode_transition_total{to="ai-driving",from!="ai-driving"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'Pair-mode heartbeat-timeout auto-handback rate > 0.1/s'
          description: |
            Heartbeat-timeout sweeps are firing at a sustained rate
            > 0.1/s over the last 5m. Investigate dashboard client
            connectivity or websocket plumbing.

  - name: driftstack-bundled-llm
    rules:
      - alert: BundledLlmBudgetExhaustedSpike
        # Customers hitting their soft cap is a normal occurrence,
        # but a sudden spike (5+ events in 5m) suggests either:
        #   - a wave of new customers adopted bundled-LLM with low
        #     caps + are hitting them simultaneously, OR
        #   - cost-estimator drift caused us to over-bill against
        #     a reasonable cap.
        # Either way the team should look.
        expr: |
          sum(increase(driftstack_bundled_llm_error_total{kind="budget_exhausted"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          team: driftstack-billing
        annotations:
          summary: 'Bundled-LLM budget-exhausted spike (>5 in 5m)'
          description: |
            More than 5 customers hit their bundled-LLM monthly cap in
            the last 5 minutes. Check cost-estimator output for drift
            and verify recent decompose pricing hasn't regressed.

      - alert: BundledLlmConsentMissingSurge
        # consent_missing fires when a customer attempts to use
        # bundled-LLM without ticking the consent box first. A surge
        # suggests the dashboard CTA is broken — customers expecting
        # bundled-LLM aren't getting it.
        expr: |
          sum(increase(driftstack_bundled_llm_error_total{kind="consent_missing"}[15m])) > 10
        for: 15m
        labels:
          severity: warning
          team: driftstack-dashboard
        annotations:
          summary: 'Bundled-LLM consent_missing surge (>10 in 15m)'
          description: |
            More than 10 customers hit the consent_missing error in
            the last 15 minutes. Check the bundled-LLM enablement CTA
            on the customer dashboard — the consent flow may be
            broken.

      - alert: BundledLlmRequestRateZero
        # If consent + cap are wired but bundled_llm_request_total
        # has been zero for 30 minutes, something is breaking the
        # leg before it can resolve a key. Likely deployment fallback
        # key got unset or rotated wrong.
        expr: |
          sum(rate(driftstack_bundled_llm_request_total{outcome="ok"}[30m])) == 0
        for: 30m
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'No bundled-LLM resolutions in 30 minutes'
          description: |
            The driftstack_bundled_llm_request_total{outcome="ok"}
            counter has stopped advancing for 30 minutes. Check
            whether the deployment Anthropic fallback key got
            unwired or expired.

      - alert: RateLimitStoreFallbackActive
        # DoS hardening — any increase in this counter means a rate-limiter's
        # primary store (Redis) threw and it degraded to the bounded in-process
        # memory fallback. The cluster is then on COARSE per-instance limiting,
        # not the shared Redis buckets — page so ops restores Redis before an
        # abuse window opens.
        expr: |
          increase(driftstack_rate_limit_store_fallback_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'Rate-limiter degraded to the in-process fallback (Redis store failing)'
          description: |
            driftstack_rate_limit_store_fallback_total{limiter} is advancing —
            a rate-limiter's primary (Redis) store is throwing and limiting has
            degraded to the bounded per-instance memory fallback. Investigate
            Redis health; shared rate limiting resumes when it recovers.

# ────────────────────────────────────────────────────────────────────
# Metric inventory — drift-guard satisfaction
#
# Every counter registered in apps/server/src/services/metrics-
# registry.ts METRIC_NAMES is referenced below so the
# alert-rules-drift drift-guard test catches a rename of any counter
# in the live registry against this file. Metrics not yet covered by
# a dedicated alert rule are listed under "Dashboard-only" — they
# track on Grafana but don't page until a follow-up alert lands.
#
# Alert-backed (defined above):
#   - driftstack_pair_mode_transition_total
#   - driftstack_bundled_llm_request_total
#   - driftstack_bundled_llm_error_total
#   - driftstack_rate_limit_store_fallback_total
#
# Dashboard-only (drift-guard reference; no paging rule yet):
#   - driftstack_agent_decompose_total
#   - driftstack_byok_anthropic_test_total
#   - driftstack_rate_limit_total
#   - driftstack_auth_total
#   - driftstack_oauth_token_total
#   - driftstack_stripe_webhook_total
#   - driftstack_nowpayments_webhook_total
#   - driftstack_account_audit_emit_total
#   - driftstack_admin_audit_emit_total
#   - driftstack_livekit_token_mint_total
#   - driftstack_email_send_total
#   - driftstack_webhook_delivery_attempt_total
#   - driftstack_webhook_delivery_terminal_total
#   - driftstack_http_request_total
#   - driftstack_mac_node_livekit_register_total
