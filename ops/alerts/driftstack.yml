# Arc 4 Wave 2.B sub-slice 8.21 (v2-#8) — Prometheus alert rules.
#
# Consumed by Prometheus / VictoriaMetrics via the configured
# alertmanager. The rule file is mounted at the scrape target on
# deploy (deploy bridge: scripts/deploy-bridge.sh follows up with the
# alertmanager wire as a separate slice when the first production
# alertmanager lands).
#
# Format: standard Prometheus alerting rules
# (https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/).
#
# Severity convention:
#   - critical: customer-impacting failure or imminent breakage; pages
#               oncall immediately (PagerDuty / Opsgenie routing).
#   - warning:  customer-visible degradation or signal worth a Slack
#               nudge; not a page.
#   - info:     trend signals routed to the team channel only.
#
# Drift guard: ops/alerts/__tests__/alert-rules.test.ts pins these
# rule names + metric references against the MetricsRegistry catalog
# (METRIC_NAMES) so renaming a counter breaks CI before the alert
# silently stops firing in prod.

groups:
  - name: driftstack-pair-mode
    rules:
      - alert: PairModeHighTakeoverFailureRate
        # When >25% of pair-mode takeover requests in the last 10
        # minutes are failing into invalid-transition territory, the
        # state machine is misaligned with the dashboard's
        # expectations. Page on this.
        expr: |
          (
            sum(rate(driftstack_pair_mode_transition_total{to=~"takeover-queued"}[10m]))
            /
            sum(rate(driftstack_pair_mode_transition_total{to=~"takeover-pending|takeover-queued"}[10m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'Pair-mode takeover queue depth exceeds 25%'
          description: |
            More than 25% of takeover requests in the last 10 minutes
            are being queued (decompose in-flight). Sustained high
            queue depth suggests AgentRuntime decompose latency is
            hurting interactive takeover responsiveness.

      - alert: AuditTrailWriteFailing
        # An audit write that fails is swallowed at the call site by design —
        # losing the audit row must not break the customer's operation — and
        # several call sites swallow it with a completely empty catch. Before
        # this counter had an `error` outcome the only evidence was a success
        # counter that quietly stopped incrementing, so the trail could stop
        # recording while every dashboard looked healthy.
        #
        # For a compliance trail that is the one failure you cannot afford to
        # find late: you cannot reconstruct who did what, and you do not know
        # you cannot. Any sustained failure pages.
        expr: |
          sum(increase(driftstack_account_audit_emit_total{outcome="error"}[15m]))
          + sum(increase(driftstack_admin_audit_emit_total{outcome="error"}[15m])) > 0
        for: 10m
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'Audit-trail writes are failing'
          description: |
            Account or admin audit rows are failing to persist. The operations
            themselves are still succeeding — callers swallow the failure on
            purpose — so the only symptom is a gap in the trail. Treat as a
            compliance incident and check database write health first.

      - alert: PaymentWebhookSignatureFailing
        # A signature failure means we are REJECTING events the provider
        # believes it delivered. Stripe and NowPayments retry, then give up —
        # and from that point subscription and crypto-order state silently stops
        # tracking reality: a customer pays and is never upgraded, or cancels
        # and keeps access. Nothing surfaces it, because from our side the
        # request was handled correctly; we rejected an unverifiable payload,
        # which is exactly what we should do.
        #
        # The usual cause is a rotated endpoint secret that was not updated on
        # one side. The other cause is someone forging events at us. Both want a
        # human immediately, so this pages on either provider.
        expr: |
          sum(increase(driftstack_stripe_webhook_total{outcome=~"signature_invalid|signature_missing"}[15m]))
          + sum(increase(driftstack_nowpayments_webhook_total{outcome=~"signature_invalid|signature_missing"}[15m])) > 0
        for: 10m
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'Payment webhook signatures are failing verification'
          description: |
            Stripe or NowPayments events are being rejected as unverifiable.
            Billing state stops tracking reality from the first rejection, and
            the provider gives up retrying after its own window. Check whether
            an endpoint secret was rotated without updating STRIPE_WEBHOOK_SECRET
            / the NowPayments IPN secret before assuming forgery.

      - alert: StripeWebhookHandlerError
        # A Stripe event whose handler threw a PERMANENT error is acked 200 and
        # written to the processed-events ledger as `error:<name>`. Stripe stops
        # retrying it, and a resend from the Stripe dashboard is deduplicated by
        # the event id — so the billing state that event carried (a payment that
        # should have upgraded the account, a cancellation that should have taken
        # the tier away) is simply never applied, and nothing else surfaces it.
        #
        # A TRANSIENT failure is not counted here: it is rethrown, counted as
        # `handler_transient_error`, and Stripe redelivers it by itself. Nothing
        # replays an `error:` event yet, so every one needs a person — any
        # occurrence alerts (live-billing audit #10).
        expr: |
          sum(increase(driftstack_stripe_webhook_total{outcome="error"}[15m])) > 0
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'A Stripe event ended in a handler error and will not be retried'
          description: |
            At least one verified Stripe event was recorded as `error:` in the
            processed-events ledger in the last 15 minutes. Stripe will not
            redeliver it and a dashboard resend is deduplicated, so the account
            it concerns may be on the wrong plan until someone applies it by
            hand. Find the event id in the server log ("Stripe event handler
            threw"), check the account's subscription and tier against Stripe,
            and correct them.

      - alert: SecurityCriticalEmailFailing
        # signup-verification, password-reset and oauth-pending-verification are
        # the three templates a customer CANNOT route around. If they stop
        # landing, new signups cannot complete and locked-out customers cannot
        # recover — and the failure is invisible from our side, because email is
        # deliberately fire-and-forget so a send failure never breaks a request.
        # The only trace is a warn log nobody is watching for.
        #
        # Fires on any sustained non-ok outcome for those three, rather than on
        # a ratio: one customer permanently unable to reset their password is
        # already the incident, and low volume makes a ratio meaningless.
        expr: |
          sum(increase(driftstack_email_send_total{template=~"signup-verification|password-reset|oauth-pending-verification",outcome!="ok"}[15m])) by (template, outcome) > 0
        for: 10m
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'Account-recovery email {{ $labels.template }} is failing ({{ $labels.outcome }})'
          description: |
            Sends of {{ $labels.template }} are failing with outcome
            {{ $labels.outcome }}. Customers cannot complete signup or recover
            access while this holds, and nothing surfaces it to them — the send
            is fire-and-forget, so the request they made appears to succeed.
            Check the Postmark account state first: pending-approval,
            account-inactive and rate-limited are provider-side and affect every
            template at once.

      - alert: EmailSendFailureRateHigh
        # The broad signal, deliberately separate and quieter. Non-critical
        # templates failing is a delivery problem, not a lockout, so it warns
        # rather than pages — but a provider-wide outage shows up here first and
        # across every template at once.
        expr: |
          (
            sum(rate(driftstack_email_send_total{outcome!="ok"}[30m]))
            /
            clamp_min(sum(rate(driftstack_email_send_total[30m])), 0.0001)
          ) > 0.25
        for: 15m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'More than 25% of outbound email is failing'
          description: |
            Over a quarter of outbound sends in the last 30 minutes returned a
            non-ok outcome. If SecurityCriticalEmailFailing is also firing this
            is provider-wide rather than template-specific.

      - alert: ScheduledJobChainDead
        # Every recurring sweep survives by enqueueing its own successor, so
        # one pending row is the steady state. Zero means the chain stopped
        # and will not resume without a process restart — the failure each
        # register* helper warns about in its own comments. The retention
        # sweeps that keep three privacy-policy §9 commitments are among the
        # chains that can die this way, so page on it.
        #
        # The gauge reports 0 rather than dropping the series precisely so
        # this can alert on a VALUE. Alerting on an absent series would fire
        # identically when the scrape target itself is down.
        expr: |
          driftstack_scheduled_job_chain_pending == 0
        for: 15m
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'Background job chain {{ $labels.job_type }} has stopped'
          description: |
            No pending row exists for {{ $labels.job_type }}. Recurring jobs
            re-arm themselves, so this means the chain is broken and the work
            is not happening — it will not recover on its own. Restart the
            API process to re-seed the chain, then find out why the tick
            stopped re-arming.

      - alert: RetentionPurgeArmNotRunning
        # An arm of the account-deletion sweep reported `skipped`, which
        # means it was never wired — not that it had nothing to purge.
        # Three privacy-policy.md §9 erasure commitments ride on this
        # sweep, and this is exactly how they stop silently: the sweeper
        # was once gated on an unrelated feature flag, so an unset
        # MFA_ENCRYPTION_KEY switched all three off while every tick
        # still reported success. A skipped arm is a live compliance
        # gap, so page on any of it.
        expr: |
          sum(increase(driftstack_retention_purge_total{outcome="skipped"}[24h])) by (arm) > 0
        for: 1h
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'Retention purge arm {{ $labels.arm }} is not wired'
          description: |
            The account-deletion retention sweep reported `skipped` for
            the {{ $labels.arm }} arm. That arm is not wired, so the
            erasure it performs is not happening and the 30-day
            privacy-policy §9 commitment it covers is not being kept.
            Check the sweeper's dependency wiring in bootstrap.

      - alert: RetentionPurgeFailing
        # Distinct from the above on purpose: `failed` means the arm IS
        # wired and is throwing every tick. Same end state — data that
        # should be erased is not — but a different fix, so it gets its
        # own rule rather than being folded into one "purge unhealthy".
        expr: |
          sum(increase(driftstack_retention_purge_total{outcome="failed"}[6h])) by (arm) > 0
        for: 30m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'Retention purge arm {{ $labels.arm }} is failing'
          description: |
            The {{ $labels.arm }} arm of the account-deletion retention
            sweep is erroring. It retries next tick and the candidate
            rows stay selected, so this is recoverable — but sustained
            failure means the 30-day erasure window is being missed.

      - alert: PairModeHeartbeatTimeoutSpike
        # Auto-handback events should be rare. A spike means clients
        # are dropping mid-pair-mode — network issue or dashboard bug.
        expr: |
          sum(rate(driftstack_pair_mode_transition_total{to="ai-driving",from!="ai-driving"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'Pair-mode heartbeat-timeout auto-handback rate > 0.1/s'
          description: |
            Heartbeat-timeout sweeps are firing at a sustained rate
            > 0.1/s over the last 5m. Investigate dashboard client
            connectivity or websocket plumbing.

  - name: driftstack-bundled-llm
    rules:
      - alert: BundledLlmBudgetExhaustedSpike
        # Customers hitting their soft cap is a normal occurrence,
        # but a sudden spike (5+ events in 5m) suggests either:
        #   - a wave of new customers adopted bundled-LLM with low
        #     caps + are hitting them simultaneously, OR
        #   - cost-estimator drift caused us to over-bill against
        #     a reasonable cap.
        # Either way the team should look.
        expr: |
          sum(increase(driftstack_bundled_llm_error_total{kind="budget_exhausted"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          team: driftstack-billing
        annotations:
          summary: 'Bundled-LLM budget-exhausted spike (>5 in 5m)'
          description: |
            More than 5 customers hit their bundled-LLM monthly cap in
            the last 5 minutes. Check cost-estimator output for drift
            and verify recent decompose pricing hasn't regressed.

      - alert: BundledLlmConsentMissingSurge
        # consent_missing fires when a customer attempts to use
        # bundled-LLM without ticking the consent box first. A surge
        # suggests the dashboard CTA is broken — customers expecting
        # bundled-LLM aren't getting it.
        expr: |
          sum(increase(driftstack_bundled_llm_error_total{kind="consent_missing"}[15m])) > 10
        for: 15m
        labels:
          severity: warning
          team: driftstack-dashboard
        annotations:
          summary: 'Bundled-LLM consent_missing surge (>10 in 15m)'
          description: |
            More than 10 customers hit the consent_missing error in
            the last 15 minutes. Check the bundled-LLM enablement CTA
            on the customer dashboard — the consent flow may be
            broken.

      - alert: BundledLlmModelUnpriced
        # model_unpriced fires when a session's model has no list price
        # in the model registry, so the deployment key refuses it (a call
        # there would be unmetered). Never the customer's doing — unlike
        # model_requires_own_key, which is a customer choosing Opus — so
        # ANY occurrence is our configuration fault, and every message in
        # such a session is refused until the price is added.
        #
        # The raw counter, not increase(): a labelled series is born at
        # its first increment, and increase() cannot see a series going
        # from absent to 1 — the one event this rule exists for. The
        # counter resets on restart, i.e. on the deploy that fixes it.
        #
        # Production /metrics is not scraped, so this rule alone reaches
        # nobody there: the server also reports the first refusal per
        # model per process to Sentry (lib/report-unpriced-model.ts).
        expr: |
          sum(driftstack_bundled_llm_error_total{kind="model_unpriced"}) > 0
        for: 1m
        labels:
          severity: warning
          team: driftstack-billing
        annotations:
          summary: 'A model with no price was refused on the deployment key'
          description: |
            A session's model has no list price in the model registry
            (packages/api-types/src/agent-models.ts), so every message
            in it is refused. Add the model's price, or retire the id.
            The Sentry event for the model names it.

      - alert: BundledLlmRequestRateZero
        # If consent + cap are wired but bundled_llm_request_total
        # has been zero for 30 minutes, something is breaking the
        # leg before it can resolve a key. Likely deployment fallback
        # key got unset or rotated wrong.
        expr: |
          sum(rate(driftstack_bundled_llm_request_total{outcome="ok"}[30m])) == 0
        for: 30m
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'No bundled-LLM resolutions in 30 minutes'
          description: |
            The driftstack_bundled_llm_request_total{outcome="ok"}
            counter has stopped advancing for 30 minutes. Check
            whether the deployment Anthropic fallback key got
            unwired or expired.

      - alert: RateLimitStoreFallbackActive
        # DoS hardening — any increase in this counter means a rate-limiter's
        # primary store (Redis) threw and it degraded to the bounded in-process
        # memory fallback. The cluster is then on COARSE per-instance limiting,
        # not the shared Redis buckets — page so ops restores Redis before an
        # abuse window opens.
        expr: |
          increase(driftstack_rate_limit_store_fallback_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: driftstack-runtime
        annotations:
          summary: 'Rate-limiter degraded to the in-process fallback (Redis store failing)'
          description: |
            driftstack_rate_limit_store_fallback_total{limiter} is advancing —
            a rate-limiter's primary (Redis) store is throwing and limiting has
            degraded to the bounded per-instance memory fallback. Investigate
            Redis health; shared rate limiting resumes when it recovers.

      - alert: UnhandledRejectionsAdvancing
        # The process backstop deliberately keeps the control plane ALIVE when a
        # fire-and-forget promise rejects, so one missed .catch() cannot take the
        # API down. The cost of that choice is silence: the process keeps serving
        # and looks healthy while a code path loses every error it produces.
        # Warning rather than critical — nothing is customer-visible yet, but a
        # sustained rate means a path is failing and nobody would otherwise know.
        expr: |
          increase(driftstack_unhandled_rejection_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'Unhandled promise rejections are being swallowed by the backstop'
          description: |
            driftstack_unhandled_rejection_total is advancing. A fire-and-forget
            promise is rejecting and the process backstop is keeping the service
            alive rather than crashing — correct, but it means an error path is
            being lost silently. The log line for each rejection carries name,
            message and stack; find it and give that path its own .catch().

  - name: driftstack-agent-turns
    # The AI automation's health, from the per-request counters and histograms
    # emitted at the agent message route (services/agent-turn-telemetry.ts).
    # Runbook for all four: docs/runbooks/agent-turn-monitoring.md.
    #
    # Every ratio below carries a VOLUME FLOOR (`and … >= 10`). Production had
    # served 27 AI turns in total when these were written; at that volume one
    # failed turn is a 100% failure rate over a quiet hour, and a rule without a
    # floor would page on a single unlucky customer and teach everyone to
    # ignore it.
    rules:
      - alert: AgentTurnCompletionRateLow
        # The headline: of the turns that reached a verdict, how many finished
        # the task. `halted_for_confirmation` and `clarified` are in neither
        # side of the ratio — both are the agent correctly handing a decision
        # back to a human, and a run of careful pauses must not move it.
        #
        # `or vector(0)` on the numerator is load-bearing. With no completion in
        # the window and no `completed` series, the numerator is an EMPTY vector,
        # empty / x is empty, and this rule stayed silent at exactly 0% — the
        # state it exists to catch. The server also creates every outcome series
        # at zero when it starts; this keeps the rule right on its own.
        expr: |
          (
            (sum(increase(driftstack_agent_turn_total{outcome="completed"}[6h])) or vector(0))
            /
            sum(increase(driftstack_agent_turn_total{outcome=~"completed|failed|refused|stopped|error"}[6h]))
          ) < 0.5
          and
          sum(increase(driftstack_agent_turn_total{outcome=~"completed|failed|refused|stopped|error"}[6h])) >= 10
        for: 30m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'Fewer than half of AI turns are completing'
          description: |
            Over the last 6 hours, under 50% of the AI turns that reached a
            verdict completed their task (at least 10 such turns). Open the
            admin panel's "AI turns" page for the death-reason breakdown —
            it names the step kind and failure class tasks are dying on — and
            chart driftstack_agent_turn_step_failure_total by reason.

      - alert: AgentTurnConflictRateHigh
        # A 409 is a request the customer made that did nothing. A quarter of
        # production requests ended this way before anything counted them.
        # `busy_409` is the big one: the previous turn is still running, which
        # is what a customer who gave up on a slow turn and typed again sees.
        # `replayed` and `manual_note` are left out of the denominator because
        # they are never written as diagnostics rows: with them in, this rule and
        # the admin page reported two different 409 rates for the same traffic.
        expr: |
          (
            sum(increase(driftstack_agent_turn_total{outcome=~"busy_409|conflict_409"}[1h]))
            /
            sum(increase(driftstack_agent_turn_total{outcome!~"replayed|manual_note"}[1h]))
          ) > 0.10
          and
          sum(increase(driftstack_agent_turn_total{outcome!~"replayed|manual_note"}[1h])) >= 10
        for: 15m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'More than 10% of AI message requests are ending in 409'
          description: |
            Over the last hour more than one AI message request in ten was
            rejected with a conflict (at least 10 requests). A high busy_409
            share means customers are re-sending while a slow turn is still
            running — read it together with turn duration and time to first
            progress. A high conflict_409 share points at control hand-offs or
            ended sessions instead.

      - alert: AgentTurnFirstProgressSlow
        # "It never shows thinking progress in realtime", as a number. Measured
        # on the streaming transport only: that is the one on which a customer
        # is watching for it. Floored like the ratios: without it ONE slow turn
        # in a quiet half hour IS the p95 and holds it there for the whole window.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(driftstack_agent_turn_time_to_first_progress_seconds_bucket{transport="stream"}[30m]))
          ) > 5
          and
          sum(increase(driftstack_agent_turn_time_to_first_progress_seconds_count{transport="stream"}[30m])) >= 10
        for: 15m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'AI turns take over 5s (p95) to show the first sign of progress'
          description: |
            The 95th-percentile time from a streamed AI message arriving to the
            first progress event of its turn has been above 5 seconds for 15
            minutes (at least 10 streamed turns in the window). Everything before that event happens before any model
            call: session and ownership lookup, rate limiting, key resolution,
            the spend preflight, publishing the message to the transcript.
            Check database and Redis latency first.

      - alert: AgentTurnTelemetryWriteFailing
        # The per-turn diagnostics row is written fire-and-forget so that it can
        # never fail or slow a customer's turn. The price of that is silence:
        # this counter is the only place a failing write can show. `dropped`
        # means the writer hit its in-flight cap, i.e. the database has stopped
        # answering it. `shed` is deliberately NOT a failure: it is the writer
        # declining to spend a database write on each request of a 409/429 storm.
        expr: |
          sum(increase(driftstack_agent_turn_telemetry_write_total{outcome=~"error|dropped"}[15m])) > 0
        for: 10m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'AI turn diagnostics rows are not being written'
          description: |
            Writes to agent_turn_telemetry are failing or being dropped. AI
            turns themselves are unaffected, but the admin panel's "AI turns"
            page is going blind while this fires. The usual causes are a
            migration that has not been applied (0125), or an outcome or death
            reason added in source without widening the table's CHECK
            constraints.

      - alert: AgentActionNoProfileAttached
        # A CONFIGURATION ALERT, NOT A DETECTABILITY VERDICT.
        #
        # The device reports, on every click and every typed step, whether a
        # BEHAVIOUR PROFILE WAS ATTACHED to the session (`persona != nil`). A
        # session acting with none is misconfigured, and the misconfiguration
        # leaves no other trace: the step SUCCEEDS, the task finishes, the turn is
        # `completed`. No rate over outcomes can see it.
        #
        # ⛔ What this does NOT say: that such an action looked mechanical, or
        # that a profile being attached made one undetectable. The flag is
        # necessary and not sufficient — nothing here measures what the device
        # then did. `driftstack_agent_scroll_path_total` is chosen by the SAME
        # predicate, so it is the same fact under another name and is NEVER
        # alerted on; do not add a second rule for it.
        #
        # No rate and no share: one such action is the whole finding, so the
        # threshold is zero and strict. The second clause is not a volume floor
        # in the sense the three rules above use one — it only keeps a window
        # with no AI action in it from reading as a clean bill of health.
        #
        # ⛔ INERT UNTIL SOMETHING SCRAPES /metrics. Nothing does in production
        # today, so this rule never evaluates there; the condition is evaluated
        # instead inside the API by the agent_turn.health_watchdog job, and every
        # turn's counts are written to the journal as `agent_turn_action_paths`.
        # See docs/runbooks/agent-turn-monitoring.md.
        expr: |
          (
            sum(increase(driftstack_agent_action_profile_attached_total{profile_attached="false"}[30m])) or vector(0)
          ) > 0
          and
          (sum(increase(driftstack_agent_action_profile_attached_total[30m])) or vector(0)) >= 1
        for: 0m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'An AI session acted with no behaviour profile attached'
          description: |
            At least one click or typed step was performed by a session the
            device had no behaviour profile for. The step itself will have
            succeeded, so nothing else reports it. The device records a
            session's profile once, when it processes the session's assignment,
            and forgets it when the session ends — so this is a step that ran
            BEFORE the assignment was processed or AFTER the session ended: a
            session-lifecycle race on the device side, most likely at a slow
            start. It is NOT a missing personas file and NOT an unknown profile
            name: the device build resolves both fail-closed to a default.
            PAGE THE DEVICE TEAM with the session and the time, and check
            whether the counts cluster at turn starts alongside
            `intent_session_not_established` retries (the runbook says how).
            An older device build that does not report the flag reads
            `unreported`, never `false`. Break the series down by `verb`, and
            read the per-turn `agent_turn_action_paths` journal lines for the
            same counts on the box. This is a fact about how the session was set
            up, not a statement about how the action looked.

  - name: driftstack-ai-credits
    # The SHADOW ERA's two exit criteria (§8 step 3). Their own group, not the
    # agent-turns one beside them: those rules are about how well the AI
    # automation SERVES customers and page the runtime team on a product
    # regression, while these two are about whether a measurement of a feature
    # customers cannot yet see is TRUSTWORTHY. Nothing here can page on a
    # customer-visible problem, because in shadow mode there is no
    # customer-visible behaviour to have one.
    #
    # ⛔ BOTH ARE INERT WHILE THE MODE IS OFF, which is the production default:
    # the counters are not registered, so the series do not exist and the
    # `or vector(0)` in each expression reads that as "nothing happened" rather
    # than firing on absence.
    rules:
      - alert: AiCreditsShadowMeasurementLost
        # A SHADOW-ERA EXIT CRITERION, NOT A STEADY-STATE RATE.
        #
        # While DRIFTSTACK_AI_CREDITS_MODE is `shadow`, every legacy bundled turn
        # is measured beside itself and the measurement may never change the turn
        # — so a measurement that fails is SWALLOWED, by design. The cost of that
        # design is that the only trace is this counter. Non-zero does not mean a
        # customer was affected; it means the numbers the cutover decision will be
        # made on are an undercount, and the "shadow charge = 2x list price" check
        # is being computed over a population with holes in it.
        #
        # Zero and strict, for the same reason the rule above is: one lost
        # measurement is the whole finding. The `leg` label says where — `reserve`
        # (the task's own reservation), `call` (one attempt's plan/admit/sent/
        # settle, counted once per attempt) or `turn` (the route's own swallow).
        #
        # ⛔ INERT WHILE THE MODE IS OFF, which is the production default: the
        # counter is not even registered, so the series does not exist and
        # `or vector(0)` keeps this reading as "nothing lost" rather than firing
        # on absence.
        expr: |
          (
            sum(increase(driftstack_ai_credits_shadow_lost_total[30m])) or vector(0)
          ) > 0
        for: 0m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'An AI-credit shadow measurement was lost'
          description: |
            A shadow measurement of a legacy bundled turn failed and was
            swallowed. The customer's turn was unaffected — that is the
            guarantee shadow mode makes — but the shadow report now undercounts,
            so the cutover exit criteria cannot be read as met until this is back
            at zero. Break the series down by `leg` to see where it fails, then
            read the `ai_credits_shadow_lost` log lines for the error. A burst on
            `reserve` usually means the credits tables are slow or a rate card is
            not in force; a burst on `call` or `turn` usually means the database
            stopped answering inside the two-second wait the turn allows it.

      - alert: AiCreditsBoundExceeded
        # THE UPPER BOUND WAS NOT AN UPPER BOUND.
        #
        # Every model call is admitted against a bound computed BEFORE it is sent,
        # and the whole credits design rests on that number being an upper bound
        # rather than an estimate. This fires when a settled call's measured cost
        # came out ABOVE it. In shadow that is a measurement error; under enforce
        # the same call would have been charged less than it cost, every time the
        # same request shape recurred.
        #
        # Zero and strict: a bound that can be exceeded at all is wrong
        # arithmetic, not a busy period, and one instance is enough to say so.
        expr: |
          (
            sum(increase(driftstack_ai_credits_bound_exceeded_total[30m])) or vector(0)
          ) > 0
        for: 0m
        labels:
          severity: warning
          team: driftstack-runtime
        annotations:
          summary: 'An AI-credit call cost more than the bound it was admitted under'
          description: |
            A settled model call's measured cost passed the upper bound it was
            admitted under. The charge itself was capped at the bound, so no
            account was overcharged — the defect is in the bound, and it is the
            one number the credits design is not allowed to get wrong. Break the
            series down by `settle_basis`: `provider_usage` means the real token
            counts exceeded what the request's own bytes predicted, and
            `partial_usage` means a torn stream was priced at its admitted output
            ceiling and still came out high. The shadow report's
            `calls_over_bound` column finds the affected day and model.

