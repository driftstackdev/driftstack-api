[package]
name = "driftstack-gui"
version = "0.1.14"
description = "Driftstack self-hosted GUI client"
authors = ["Driftstack"]
edition = "2021"
license = "MIT"
publish = false  # binary, not a library; never published to crates.io

[lib]
name = "driftstack_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
# Decode the protected-file b64 launch payload (multi-window simulator, founder
# 2026-06-23) so a new per-session window loads the session via its internal URL.
# argv carries only `--ds-label=<non-secret session id>`.
base64 = "0.22"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-fs = "2.0"
# E-2 exit-geo probe: HTTPS GET /v1/egress/echo THROUGH the customer's
# SOCKS5 proxy (probe-backend design build-order 2). rustls = no
# OpenSSL system dependency; socks-proxy = native socks5:// support.
ureq = { version = "2.10", default-features = false, features = ["tls", "socks-proxy", "json"] }
# V-243 / D-2026-05-06-03 — Tauri Updater for cross-platform auto-update.
# Public-key signature verification on update bundles; signing key
# generated via `npx tauri signer generate` (founder action; see
# docs/founder-actions/v243-tauri-updater-keys.md).
tauri-plugin-updater = "2.0"
# V-243 — process plugin: provides relaunch() so the in-app updater can
# restart into the freshly-installed bundle (downloadAndInstall does NOT
# auto-relaunch on macOS/Linux in Tauri v2).
tauri-plugin-process = "2.0"
# V-328 — custom URL scheme deep-link plugin. Registers
# `driftstack://` so the OS hands off URLs of that scheme to this
# binary. Replaces the V-268 polling loop in browser-sign-in.ts:
# the dashboard's confirmation page redirects to
# driftstack://auth/callback?code=...&state=... and the desktop
# picks up the event immediately (vs. 2s poll cadence).
# Cross-platform setup details in docs/founder-actions/
# v328-tauri-deep-link-test.md — needs per-OS bundle test before
# release.
tauri-plugin-deep-link = "2.0"
# Single-instance guard: a second launch focuses the existing window
# instead of spawning a duplicate (the comment at lib.rs claimed this but
# the plugin was never wired → two instances could stack + wedge into a
# "not responding" window — founder-hit 2026-06-13).
tauri-plugin-single-instance = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Short-lived per-session simulator control credentials never need durable OS
# keychain persistence. Keep their bounded process-memory copies zeroized on
# replacement, eviction, expiry, explicit deletion, and process teardown.
zeroize = "1"
# V-241 T3 #1 (D-2026-05-06-01): keyring-rs for cross-platform OS
# keychain access. macOS Keychain / Windows Credential Manager / Linux
# Secret Service or KWallet — handled transparently per-platform.
# Service name "dev.driftstack.gui" matches the Tauri identifier so the
# stored secrets surface under the app's identity in OS-native UI.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Protected simulator payload handoff: O_NOFOLLOW prevents a crafted temp-path
# symlink from being followed while the single-use file is consumed.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Dynamic Dock icon for the separate "Driftstack Simulator" app (founder
# 2026-06-18: the running simulator's Dock should reflect the session — the
# proxy country FLAG as the icon + the profile name on it). macOS-only; uses
# AppKit to draw the flag emoji (regional-indicator pair, which macOS renders as
# the flag image) + the profile name into an NSImage and set it as the Dock icon
# via NSApplication.setApplicationIconImage (set_dock_tile / reset_dock_tile in
# lib.rs). objc2 + objc2-app-kit are the modern, memory-safe Objective-C
# bindings and are ALREADY in the lockfile (transitive via Tauri 2's macOS
# stack) at these exact versions, so no new crate resolution churn — only extra
# *features* of the same crates are enabled.
#   • NSImage / NSGraphics / NSColor / NSFont — build + draw the icon image.
#   • NSStringDrawing / NSAttributedString — draw the flag emoji + name string.
#   • NSDockTile — clear the badge (the name rides the icon, not a text badge).
# objc2-foundation gains NSDictionary/NSGeometry (the draw-attributes dict +
# CGRect/CGSize) on top of the NSString it already used.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# block2 powers the block-based +[NSImage imageWithSize:flipped:drawingHandler:]
# (the resolution-independent, non-deprecated way to draw an off-screen image —
# replaces the deprecated lockFocus/unlockFocus). Already in the lockfile
# (transitive via objc2's stack).
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDictionary",
    "NSGeometry",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", features = [
    "block2",
    "NSApplication",
    "NSDockTile",
    "NSImage",
    "NSGraphics",
    "NSColor",
    "NSFont",
    "NSStringDrawing",
    "NSAttributedString",
] }

[features]
# Customer-facing build defaults to no devtools; opens up by passing
# `--features devtools` during `cargo tauri dev`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
