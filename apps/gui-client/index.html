<!doctype html>
<html lang="en" data-mode="dark" data-accent="oxblood">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Driftstack</title>
    <script>
      // Fail-visible early guard (architectural: never silently fail to open).
      // Runs BEFORE the app bundle so it catches even a module-load failure,
      // plus a mount-timeout so a never-rendering UI surfaces a code instead of
      // a blank/flickering window. main.tsx shares the window.__dsFatalShown flag.
      (function () {
        function esc(s) {
          return String(s).replace(/[&<>]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
          });
        }
        window.__dsFatal = function (code, err) {
          if (window.__dsFatalShown) return;
          window.__dsFatalShown = true;
          var msg = err && err.message ? err.message : String(err);
          var stack = err && err.stack ? err.stack : '';
          try {
            var b = document.createElement('div');
            b.setAttribute('data-fatal-error', code);
            b.style.cssText =
              'position:fixed;inset:0;z-index:2147483647;background:#0b0b0b;color:#eee;font:13px/1.55 -apple-system,system-ui,sans-serif;padding:28px;overflow:auto';
            b.innerHTML =
              '<div style="max-width:720px;margin:0 auto"><h1 style="font-size:16px;color:#ff6b6b;margin:0 0 4px">Driftstack could not start</h1><div style="color:#888;margin:0 0 18px">Error code: <b style="color:#ffb86b">' +
              esc(code) +
              '</b></div><div style="background:#161616;border:1px solid #333;border-radius:8px;padding:12px 14px;margin:0 0 12px"><b>' +
              esc(msg || '(no message)') +
              '</b></div>' +
              (stack
                ? '<pre style="white-space:pre-wrap;word-break:break-word;color:#9aa;background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:12px;font-size:11px;max-height:45vh;overflow:auto">' +
                  esc(stack) +
                  '</pre>'
                : '') +
              '<button onclick="location.reload()" style="margin-top:16px;background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:6px;padding:8px 16px;cursor:pointer">Reload</button></div>';
            (document.body || document.documentElement).appendChild(b);
          } catch (e) {
            document.title = 'Driftstack error ' + code + ': ' + msg;
          }
        };
        window.addEventListener('error', function (e) {
          window.__dsFatal('WINDOW_ERROR', e.error || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          window.__dsFatal('UNHANDLED_REJECTION', e.reason);
        });
        // Poll for the React mount instead of one hard 8s deadline: a CPU-starved
        // machine (a heavy build/CI on the same box) can take well over 8s to
        // parse + mount a ~1.4MB bundle in WKWebView, and a hard fail there is a
        // FALSE negative that blocks a perfectly good app. Succeed the instant
        // #root has children; only surface MOUNT_TIMEOUT if it TRULY never mounts
        // within a generous window.
        var __dsMountStart = Date.now();
        var __dsMountPoll = setInterval(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            clearInterval(__dsMountPoll); // mounted — all good
            return;
          }
          if (Date.now() - __dsMountStart >= 30000 && !window.__dsFatalShown) {
            clearInterval(__dsMountPoll);
            window.__dsFatal(
              'MOUNT_TIMEOUT',
              new Error(
                'UI did not render within 30s — the bundle loaded but React did not mount.',
              ),
            );
          }
        }, 500);
      })();
    </script>
  </head>
  <body class="bg-surface-base text-ink-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
