<!doctype html>
<html lang="en" data-mode="light" data-accent="oxblood">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Driftstack</title>
    <script>
      // Pre-paint theme (2026-09-25). <html data-mode="light"> above is the NEW
      // install default (settings.ts DEFAULT_SETTINGS agrees). The mode a
      // customer is actually on lives in the Tauri store, which is read only
      // after the bundle loads, so SettingsContext mirrors it to localStorage
      // (src/lib/boot-theme.ts) and this reads it back before the first frame:
      // the splash, the fatal panel and the window itself open in the saved
      // mode instead of flashing the default. The simulator window is pinned
      // dark (main.tsx), so it is pinned here too, before its first paint.
      //
      // __dsBootColours is the SAME table as BOOT_COLOURS in boot-theme.ts —
      // the mode tokens of src/styles/index.css as hex. Inline styles, so the
      // splash and the fatal panel paint even when the CSS did not load. The
      // guard test reads this table, that one and index.css, and fails when
      // any of the three disagree. It lives in the SAME script as the
      // fail-visible guard below, so the guard's panel never depends on a
      // second script having run.
      (function () {
        var palette = {
          light: {
            base: '#ebedf2',
            raised: '#f8f9fb',
            inset: '#e0e3ea',
            divider: '#cdd3dc',
            ink: '#1a1d23',
            inkSecondary: '#525863',
            inkMuted: '#5b6270',
            accent: '#a83b4d',
            onAccent: '#ffffff',
          },
          dark: {
            base: '#0f172a',
            raised: '#1e293b',
            inset: '#0a0f1c',
            divider: '#475569',
            ink: '#f1f5f9',
            inkSecondary: '#cbd5e1',
            inkMuted: '#94a3b8',
            accent: '#a83b4d',
            onAccent: '#ffffff',
          },
        };
        var mode = null;
        try {
          if (new URLSearchParams(window.location.search).get('window') === 'simulator') {
            mode = 'dark';
          } else {
            var saved = window.localStorage.getItem('ds_theme_mode');
            if (saved === 'light' || saved === 'dark') mode = saved;
          }
        } catch (e) {
          // No storage (a locked-down webview): the default above stands.
        }
        if (mode !== null) document.documentElement.setAttribute('data-mode', mode);
        // Read at PAINT time, not now: by the time a fatal panel paints, React
        // may have applied the live setting.
        window.__dsBootColours = function () {
          return document.documentElement.getAttribute('data-mode') === 'dark'
            ? palette.dark
            : palette.light;
        };
      })();

      // Fail-visible early guard (architectural: never silently fail to open).
      // Runs BEFORE the app bundle so it catches even a module-load failure,
      // plus a mount-timeout so a never-rendering UI surfaces a code instead of
      // a blank/flickering window. main.tsx shares the window.__dsFatalShown flag.
      (function () {
        function esc(s) {
          return String(s).replace(/[&<>]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
          });
        }
        window.__dsFatal = function (code, err) {
          if (window.__dsFatalShown) return;
          window.__dsFatalShown = true;
          var msg = err && err.message ? err.message : String(err);
          var stack = err && err.stack ? err.stack : '';
          try {
            var c = window.__dsBootColours();
            var b = document.createElement('div');
            b.setAttribute('data-fatal-error', code);
            b.style.cssText =
              'position:fixed;inset:0;z-index:2147483647;background:' +
              c.base +
              ';color:' +
              c.ink +
              ';font:13px/1.55 -apple-system,system-ui,sans-serif;padding:28px;overflow:auto';
            // Friendly-first (matches main.tsx): human copy + Reload up front, the
            // code/message/stack tucked behind a collapsed <details> so an end user
            // never faces a raw stack trace.
            b.innerHTML =
              '<div style="max-width:640px;margin:12vh auto 0"><h1 style="font-size:17px;color:' +
              c.ink +
              ';margin:0 0 8px">Driftstack hit a snag</h1><div style="color:' +
              c.inkSecondary +
              ';margin:0 0 20px">The app needs to reload to recover. Your saved profiles and sessions are safe.</div>' +
              '<button id="ds-fatal-reload" style="background:' +
              c.accent +
              ';color:' +
              c.onAccent +
              ';border:none;border-radius:4px;padding:9px 18px;cursor:pointer;font-size:13px;font-weight:600">Reload Driftstack</button>' +
              '<details style="margin-top:22px"><summary style="cursor:pointer;font-size:12px;color:' +
              c.inkMuted +
              ';user-select:none;outline:none">Show technical details</summary>' +
              '<div style="color:' +
              c.inkMuted +
              ';margin:10px 0 0">Error code: <b style="color:' +
              c.ink +
              '">' +
              esc(code) +
              '</b></div><div style="background:' +
              c.raised +
              ';border:1px solid ' +
              c.divider +
              ';border-radius:6px;padding:10px 12px;margin:8px 0 0;color:' +
              c.inkSecondary +
              ';font-size:12px">' +
              esc(msg || '(no message)') +
              '</div>' +
              (stack
                ? '<pre style="white-space:pre-wrap;word-break:break-word;color:' +
                  c.inkMuted +
                  ';background:' +
                  c.inset +
                  ';border:1px solid ' +
                  c.divider +
                  ';border-radius:6px;padding:10px;font-size:11px;max-height:38vh;overflow:auto;margin:8px 0 0">' +
                  esc(stack) +
                  '</pre>'
                : '') +
              '</details></div>';
            (document.body || document.documentElement).appendChild(b);
            var reloadButton = document.getElementById('ds-fatal-reload');
            if (reloadButton) {
              reloadButton.addEventListener('click', function () {
                location.reload();
              });
            }
            var sp = document.getElementById('ds-boot-splash');
            if (sp) sp.remove();
          } catch (e) {
            document.title = 'Driftstack error ' + code + ': ' + msg;
          }
        };
        // These two listeners are for STARTUP only. Once the app has started
        // (main.tsx sets __dsBooted when the React tree commits), main.tsx owns
        // every error: it ignores benign LiveKit/WebRTC teardown races and turns
        // anything else into a small non-fatal notice. These run FIRST, so without
        // this stand-down they painted the latched full-screen overlay over a live
        // session before main.tsx could decide (GUI audit #1).
        window.addEventListener('error', function (e) {
          if (window.__dsBooted) return;
          window.__dsFatal('WINDOW_ERROR', e.error || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (window.__dsBooted) return;
          window.__dsFatal('UNHANDLED_REJECTION', e.reason);
        });
        // Poll for the React mount instead of one hard deadline: a CPU-starved
        // machine (a heavy build/CI on the same box, or the GUI running over
        // Screen Sharing on a box that's also compiling) can take well over 30s
        // to parse + mount a ~1.4MB bundle in WKWebView, and a hard fail there is
        // a FALSE negative that blocks a perfectly good app (founder-hit
        // 2026-07-07 at machine load 56). Succeed the instant #root has children.
        //
        // STARVATION-ADAPTIVE (harness co-diagnosis): this poll runs on the SAME JS
        // thread as the bundle, so under starvation its own ticks fire LATE. A
        // tick that arrives far later than its 500ms interval proves the thread
        // was BLOCKED (parsing/mounting, not hung) — that stalled time is not
        // "React failed to mount", so credit it back instead of counting it toward
        // the budget. Net: the 30s measures RESPONSIVE time, so a slow-but-fine
        // mount under load extends the budget rather than false-failing; only a
        // genuine hang (thread responsive, 30s of it elapsed, still no #root
        // children) surfaces the panel.
        var __dsMountStart = Date.now();
        var __dsLastTick = Date.now();
        var __dsMountPoll = setInterval(function () {
          var now = Date.now();
          var gap = now - __dsLastTick;
          __dsLastTick = now;
          // Tick fired >4x late ⇒ the thread was blocked; don't count that stall.
          if (gap > 2000) __dsMountStart += gap - 500;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            clearInterval(__dsMountPoll); // mounted — all good
            var sp = document.getElementById('ds-boot-splash');
            if (sp) sp.remove(); // React committed — drop the splash
            return;
          }
          if (now - __dsMountStart >= 30000 && !window.__dsFatalShown) {
            clearInterval(__dsMountPoll);
            window.__dsFatal(
              'MOUNT_TIMEOUT',
              new Error(
                'The app took too long to start — your Mac may be under heavy load ' +
                  '(a build, or many apps open). Close some, then press Reload.',
              ),
            );
          }
        }, 500);
      })();
    </script>
    <style>
      @keyframes ds-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-surface-base text-ink-primary font-sans antialiased">
    <div id="root"></div>
    <script>
      // Boot splash (architectural: the window must NEVER be an unexplained blank
      // rectangle). Painted immediately as a SIBLING of #root — never a child, so
      // the mount-poll's `#root has children` test still detects the real React
      // mount — and removed the instant React commits (or a fatal panel paints).
      // Skipped for the bare `?window=simulator` window, which is transparent and
      // renders only the device frame (a solid splash would look wrong there).
      (function () {
        if (new URLSearchParams(window.location.search).get('window') === 'simulator') return;
        // The saved mode's own tokens (the pre-paint script in <head>): ground
        // --surface-base, caption --ink-muted, spinner track --surface-divider,
        // spinner head the accent.
        var c = window.__dsBootColours();
        var s = document.createElement('div');
        s.id = 'ds-boot-splash';
        s.style.cssText =
          'position:fixed;inset:0;z-index:2147483640;display:flex;flex-direction:column;' +
          'align-items:center;justify-content:center;gap:16px;background:' +
          c.base +
          ';font:13px/1.5 -apple-system,system-ui,sans-serif;color:' +
          c.inkMuted;
        s.innerHTML =
          '<div style="width:26px;height:26px;border:2.5px solid ' +
          c.divider +
          ';border-top-color:' +
          c.accent +
          ';border-radius:50%;animation:ds-boot-spin .8s linear infinite"></div>' +
          '<div>Starting Driftstack…</div>';
        (document.body || document.documentElement).appendChild(s);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
