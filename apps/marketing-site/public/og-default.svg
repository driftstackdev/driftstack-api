<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Social card — Fleet rework (light + violet, founder-locked 2026-06-12). -->
  <rect width="1200" height="630" fill="#f2f3f6"/>
  <rect x="0" y="0" width="1200" height="6" fill="#6d5efc"/>
  <g transform="translate(60 56) scale(0.55)">
    <rect x="46" y="30" width="118" height="194" rx="34"
          fill="none" stroke="#474a55" stroke-width="14" opacity="0.55"
          transform="rotate(-7 105 127)"/>
    <rect x="86" y="30" width="118" height="194" rx="34" fill="#6d5efc"/>
    <circle cx="145" cy="192" r="12" fill="#ffffff"/>
  </g>
  <text x="210" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="64" font-weight="900" font-style="italic" letter-spacing="-2">
    <tspan fill="#15161a">DRIFT</tspan><tspan fill="#6d5efc">STACK</tspan>
  </text>
  <text x="60" y="330" fill="#15161a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="58" font-weight="650">iPhone Safari sessions, on demand.</text>
  <text x="60" y="404" fill="#474a55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="36" font-weight="450">A real iPhone browser in the cloud — every website</text>
  <text x="60" y="454" fill="#474a55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="36" font-weight="450">sees a genuine iPhone, never a bot.</text>
  <text x="60" y="560" fill="#6d5efc" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="26" font-weight="600">driftstack.dev</text>
