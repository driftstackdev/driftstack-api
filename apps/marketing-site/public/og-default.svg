<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Social card — dark + oxblood ("Fleet Mission Control — Dark + Red",
       founder-locked 2026-06-15; supersedes the 2026-06-12 light+violet
       card). Regenerate og-default.png via scripts/gen-og-image.mjs after
       editing, and bump the ?v= query in BaseLayout (immutable edge cache). -->
  <rect width="1200" height="630" fill="#060608"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f5f5f7" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridfade" cx="30%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask">
      <rect width="1200" height="630" fill="url(#gridfade)"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#9b3b46"/>
  <g transform="translate(60 56) scale(0.55)">
    <rect x="46" y="30" width="118" height="194" rx="34"
          fill="none" stroke="#8c8c96" stroke-width="14" opacity="0.5"
          transform="rotate(-7 105 127)"/>
    <rect x="86" y="30" width="118" height="194" rx="34" fill="#9b3b46"/>
    <circle cx="145" cy="192" r="12" fill="#ffffff"/>
  </g>
  <text x="210" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="64" font-weight="900" font-style="italic" letter-spacing="-2">
    <tspan fill="#f5f5f7">DRIFT</tspan><tspan fill="#c04b58">STACK</tspan>
  </text>
  <text x="60" y="330" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="58" font-weight="650">Command a fleet of real iPhones.</text>
  <text x="60" y="404" fill="#b0b0bb" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="36" font-weight="450">Real iPhone Safari in the cloud — to every website,</text>
  <text x="60" y="454" fill="#b0b0bb" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="36" font-weight="450">they're just people on phones.</text>
  <text x="60" y="560" fill="#c04b58" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="26" font-weight="600">driftstack.io</text>
  <text x="1140" y="560" text-anchor="end" fill="#8c8c96" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="22" font-weight="500">App · Code · AI</text>
</svg>
